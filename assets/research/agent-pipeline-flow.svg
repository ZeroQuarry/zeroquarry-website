<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The pipeline when agents write most of the code</text>
  <text x="28" y="62" font-size="14" fill="#475569">Same six steps every engineering org claims. The middle four changed what they actually test.</text>

  <!-- 1. Brief -->
  <rect x="24" y="88" width="112" height="170" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="80" y="112" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">1. Brief</text>
  <text x="80" y="134" font-size="10.5" fill="#475569" text-anchor="middle">the issue: personas,</text>
  <text x="80" y="150" font-size="10.5" fill="#475569" text-anchor="middle">why now, goals,</text>
  <text x="80" y="166" font-size="10.5" fill="#475569" text-anchor="middle">non-goals</text>
  <text x="80" y="192" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">written for humans</text>
  <text x="80" y="206" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">and agents</text>
  <text x="80" y="228" font-size="10" fill="#64748b" text-anchor="middle">a sloppy brief gets</text>
  <text x="80" y="244" font-size="10" fill="#64748b" text-anchor="middle">implemented as written</text>

  <!-- 2. Agent -->
  <rect x="140" y="88" width="112" height="170" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#ds)"/>
  <text x="196" y="112" font-size="12.5" font-weight="700" fill="#5b21b6" text-anchor="middle">2. Agent</text>
  <text x="196" y="134" font-size="10.5" fill="#4c1d95" text-anchor="middle">branch named</text>
  <text x="196" y="150" font-size="10.5" fill="#4c1d95" text-anchor="middle">after the issue;</text>
  <text x="196" y="166" font-size="10.5" fill="#4c1d95" text-anchor="middle">opened by an</text>
  <text x="196" y="182" font-size="10.5" fill="#4c1d95" text-anchor="middle">account that is</text>
  <text x="196" y="198" font-size="10.5" fill="#4c1d95" text-anchor="middle">not a person</text>
  <text x="196" y="224" font-size="10" fill="#64748b" text-anchor="middle">locally plausible:</text>
  <text x="196" y="238" font-size="10" fill="#64748b" text-anchor="middle">nothing to</text>
  <text x="196" y="252" font-size="10" fill="#64748b" text-anchor="middle">skim toward</text>

  <!-- 3. CI -->
  <rect x="256" y="88" width="112" height="170" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="312" y="112" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">3. CI</text>
  <text x="312" y="134" font-size="10.5" fill="#475569" text-anchor="middle">tests, types, lint</text>
  <text x="312" y="162" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">catches functional</text>
  <text x="312" y="176" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">truth on the</text>
  <text x="312" y="190" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">happy path</text>
  <text x="312" y="216" font-size="10" fill="#64748b" text-anchor="middle">agents pass this</text>
  <text x="312" y="230" font-size="10" fill="#64748b" text-anchor="middle">more reliably</text>
  <text x="312" y="244" font-size="10" fill="#64748b" text-anchor="middle">than humans</text>

  <!-- 4. e2e -->
  <rect x="372" y="88" width="112" height="170" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="428" y="112" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">4. e2e</text>
  <text x="428" y="134" font-size="10.5" fill="#475569" text-anchor="middle">against a real</text>
  <text x="428" y="150" font-size="10.5" fill="#475569" text-anchor="middle">deployment,</text>
  <text x="428" y="166" font-size="10.5" fill="#475569" text-anchor="middle">not a mock</text>
  <text x="428" y="192" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">catches auth</text>
  <text x="428" y="206" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">boundaries, state,</text>
  <text x="428" y="220" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">"200 but wrong"</text>
  <text x="428" y="244" font-size="10" fill="#64748b" text-anchor="middle">the failure modes</text>
  <text x="428" y="258" font-size="10" fill="#64748b" text-anchor="middle">that matter</text>

  <!-- 5. Verdict -->
  <rect x="488" y="88" width="112" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="544" y="112" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">5. Verdict</text>
  <text x="544" y="134" font-size="10.5" fill="#14532d" text-anchor="middle">does it do what the</text>
  <text x="544" y="150" font-size="10.5" fill="#14532d" text-anchor="middle">brief says; what did</text>
  <text x="544" y="166" font-size="10.5" fill="#14532d" text-anchor="middle">it silently not do;</text>
  <text x="544" y="182" font-size="10.5" fill="#14532d" text-anchor="middle">failure modes</text>
  <text x="544" y="198" font-size="10.5" fill="#14532d" text-anchor="middle">tested?</text>
  <text x="544" y="224" font-size="10" fill="#64748b" text-anchor="middle">"is this code right"</text>
  <text x="544" y="238" font-size="10" fill="#64748b" text-anchor="middle">becomes "what does</text>
  <text x="544" y="252" font-size="10" fill="#64748b" text-anchor="middle">it get wrong"</text>

  <!-- 6. Merge -->
  <rect x="604" y="88" width="112" height="170" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="660" y="112" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">6. Merge</text>
  <text x="660" y="134" font-size="10.5" fill="#475569" text-anchor="middle">a person presses</text>
  <text x="660" y="150" font-size="10.5" fill="#475569" text-anchor="middle">it, even when the</text>
  <text x="660" y="166" font-size="10.5" fill="#475569" text-anchor="middle">agent's PR is</text>
  <text x="660" y="182" font-size="10.5" fill="#475569" text-anchor="middle">better than mine</text>
  <text x="660" y="208" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">the decision keeps</text>
  <text x="660" y="222" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">a person's name</text>
  <text x="660" y="236" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">on it</text>

  <line x1="136" y1="173" x2="138" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="252" y1="173" x2="254" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="368" y1="173" x2="370" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="173" x2="486" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="173" x2="602" y2="173" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blind strip -->
  <rect x="24" y="286" width="692" height="96" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#ds)"/>
  <text x="370" y="314" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">What none of the six gates are built to see</text>
  <text x="370" y="336" font-size="12.5" fill="#7f1d1d" text-anchor="middle">the AI surface the change introduces: the MCP config it added, the model it pinned,</text>
  <text x="370" y="354" font-size="12.5" fill="#7f1d1d" text-anchor="middle">the tool permissions it granted, the instruction file it edited to steer the next agent</text>
  <text x="370" y="374" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">tests prove the feature works. None of them ask what it calls, embeds, or delegates to.</text>

  <!-- Steering docs note -->
  <rect x="24" y="406" width="692" height="88" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="370" y="432" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">The steering documents are config now</text>
  <text x="370" y="454" font-size="12.5" fill="#92400e" text-anchor="middle">AGENTS.md, skill files, MCP configs, and issue comments steer every agent that reads them.</text>
  <text x="370" y="474" font-size="12.5" fill="#92400e" text-anchor="middle">We review, version, and diff them like CI definitions, because that's the category they're in.</text>

  <text x="380" y="534" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">A good brief gets implemented the way it was meant. A sloppy brief gets implemented</text>
  <text x="380" y="554" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">the way it was written, which is occasionally a different thing.</text>
</svg>
