<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The authorship-detection pitch versus the artifact</text>
  <text x="28" y="62" font-size="14" fill="#475569">One side sells a guess about history. The other reads facts off the repo in front of you.</text>

  <!-- pitch panel -->
  <rect x="28" y="86" width="342" height="270" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#ds)"/>
  <text x="48" y="118" font-size="16" font-weight="700" fill="#991b1b">The pitch</text>
  <text x="48" y="144" font-size="12.5" fill="#7f1d1d">· detects whether code was written by AI</text>
  <text x="48" y="166" font-size="12.5" fill="#7f1d1d">· a percentage of AI authorship</text>
  <text x="48" y="188" font-size="12.5" fill="#7f1d1d">· an "AI-free" badge for vendors</text>
  <text x="48" y="220" font-size="13" font-weight="600" fill="#991b1b">What breaks it</text>
  <text x="60" y="242" font-size="12.5" fill="#7f1d1d">· a human writing in the same idiom</text>
  <text x="60" y="262" font-size="12.5" fill="#7f1d1d">· a detector trained on last year's models</text>
  <text x="60" y="282" font-size="12.5" fill="#7f1d1d">· a real repository</text>
  <text x="48" y="322" font-size="12.5" font-weight="700" fill="#991b1b">Authorship is a fact about history.</text>
  <text x="48" y="340" font-size="12.5" font-weight="700" fill="#991b1b">The artifact can't prove it.</text>

  <!-- artifact panel -->
  <rect x="390" y="86" width="342" height="270" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="410" y="118" font-size="16" font-weight="700" fill="#166534">The artifact</text>
  <text x="410" y="144" font-size="13" font-weight="600" fill="#14532d">What the code calls</text>
  <text x="422" y="164" font-size="12.5" fill="#14532d">SDKs, model identifiers, endpoints</text>
  <text x="410" y="192" font-size="13" font-weight="600" fill="#14532d">What it embeds</text>
  <text x="422" y="212" font-size="12.5" fill="#14532d">system prompts, skill files</text>
  <text x="410" y="240" font-size="13" font-weight="600" fill="#14532d">What it delegates to</text>
  <text x="422" y="260" font-size="12.5" fill="#14532d">MCP configs, tool permission scope</text>
  <text x="410" y="288" font-size="13" font-weight="600" fill="#14532d">The failure patterns</text>
  <text x="422" y="308" font-size="12.5" fill="#14532d">nonexistent dependencies, reachable</text>
  <text x="422" y="326" font-size="12.5" fill="#14532d">prompts, permissive agent configs</text>
  <text x="410" y="344" font-size="12" font-weight="700" fill="#166534">Facts you can verify by reading the repo.</text>

  <!-- punchline bar -->
  <rect x="28" y="376" width="704" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="398" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">The question that ends the pitch: what does it say when a human writes the same pattern?</text>
  <text x="380" y="418" font-size="12" fill="#475569" text-anchor="middle">Watch the demo operator discover that the demo has no answer.</text>
</svg>
