<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" fill="#0f172a" font-weight="700">What the agent reads at each step</text>
  <text x="28" y="62" font-size="14" fill="#475569">The SDLC, written where the agent will actually look.</text>

  <rect x="20" y="96" width="132" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="86" y="128" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">1. issue</text>
  <rect x="20" y="164" width="132" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#ds)"/>
  <text x="86" y="186" font-size="10.5" fill="#5b21b6" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">the issue body</text>
  <text x="86" y="210" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">personas</text>
  <text x="86" y="227" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">why now</text>
  <text x="86" y="244" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">goals</text>
  <text x="86" y="261" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">non-goals</text>
  <rect x="167" y="96" width="132" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="233" y="128" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">2. branch</text>
  <rect x="167" y="164" width="132" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#ds)"/>
  <text x="233" y="186" font-size="10.5" fill="#5b21b6" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">AGENTS.md</text>
  <text x="233" y="210" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">trunk-based</text>
  <text x="233" y="227" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">small branches</text>
  <text x="233" y="244" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">close them out</text>
  <text x="233" y="261" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">fast</text>
  <rect x="314" y="96" width="132" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="380" y="128" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">3. commit</text>
  <rect x="314" y="164" width="132" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#ds)"/>
  <text x="380" y="186" font-size="10.5" fill="#5b21b6" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">AGENTS.md</text>
  <text x="380" y="210" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">conventional</text>
  <text x="380" y="227" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">commits 1.0.0</text>
  <text x="380" y="244" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">issue number</text>
  <text x="380" y="261" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">in the body</text>
  <rect x="461" y="96" width="132" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="527" y="128" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">4. review</text>
  <rect x="461" y="164" width="132" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#ds)"/>
  <text x="527" y="186" font-size="10.5" fill="#5b21b6" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">$code-review</text>
  <text x="527" y="210" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">MUST FIX</text>
  <text x="527" y="227" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">SHOULD FIX</text>
  <text x="527" y="244" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">CONSIDER</text>
  <text x="527" y="261" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">(doesn't block)</text>
  <rect x="608" y="96" width="132" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="674" y="128" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">5. deploy</text>
  <rect x="608" y="164" width="132" height="124" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#ds)"/>
  <text x="674" y="186" font-size="10.5" fill="#5b21b6" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">the e2e gate</text>
  <text x="674" y="210" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">unit tests local</text>
  <text x="674" y="227" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">e2e on a real</text>
  <text x="674" y="244" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">deployment, never</text>
  <text x="674" y="261" font-size="10" fill="#475569" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">in CI</text>
  <path d="M 154 122 L 165 122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 301 122 L 312 122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 448 122 L 459 122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 595 122 L 606 122" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="320" width="345" height="112" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#ds)"/>
  <text x="48" y="348" font-size="12.5" fill="#92400e" font-weight="700">the exception</text>
  <text x="48" y="374" font-size="11" fill="#334155">emergency patches skip the issue, but stay</text>
  <text x="48" y="392" font-size="11" fill="#334155">small, contained and reviewable.</text>
  <text x="48" y="412" font-size="10.5" fill="#92400e" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">and it still needs to pass the e2e gate</text>
  <rect x="392" y="320" width="340" height="112" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#ds)"/>
  <text x="412" y="348" font-size="12.5" fill="#5b21b6" font-weight="700">checked, not just written</text>
  <text x="412" y="374" font-size="11" fill="#334155">the layering guard, the pinned linter,</text>
  <text x="412" y="392" font-size="11" fill="#334155">the lockfile: these fail CI, so they</text>
  <text x="412" y="410" font-size="11" fill="#334155">hold without the agent remembering them</text>
</svg>
