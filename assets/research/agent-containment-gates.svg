<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="ds3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="700" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Every http_request passes the gates</text>
  <text x="28" y="62" font-size="14" fill="#475569">The model asks; deterministic code says yes or no. Refusals come back as tool errors the agent can pivot on.</text>

  <!-- step 0 -->
  <rect x="200" y="84" width="360" height="64" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#ds3)"/>
  <text x="380" y="112" font-size="14.5" font-weight="700" fill="#3b0764" text-anchor="middle">the agent calls http_request(url, ...)</text>
  <text x="380" y="133" font-size="12.5" fill="#4c1d95" text-anchor="middle">a URL is a claim about the world, not a fact</text>

  <path d="M 380 148 L 380 170" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g3)" fill="none"/>

  <!-- gate 1 -->
  <rect x="120" y="174" width="520" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds3)"/>
  <text x="140" y="202" font-size="14.5" font-weight="700" fill="#166534">1 · Scope</text>
  <text x="140" y="224" font-size="13" fill="#14532d">checked against the scan's declared targets before any DNS lookup or connection</text>

  <path d="M 380 246 L 380 268" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g3)" fill="none"/>

  <!-- gate 2 -->
  <rect x="120" y="272" width="520" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds3)"/>
  <text x="140" y="300" font-size="14.5" font-weight="700" fill="#166534">2 · SSRF guard</text>
  <text x="140" y="322" font-size="13" fill="#14532d">resolve the hostname: every IP must be public, or the request is refused</text>
  <text x="140" y="342" font-size="13" fill="#14532d">metadata and private addresses blocked · resolver errors fail closed</text>

  <path d="M 380 364 L 380 386" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g3)" fill="none"/>

  <!-- gate 3 -->
  <rect x="120" y="390" width="520" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds3)"/>
  <text x="140" y="418" font-size="14.5" font-weight="700" fill="#166534">3 · Pacing</text>
  <text x="140" y="440" font-size="13" fill="#14532d">token bucket built by the platform from the scan's config · default 5 req/s</text>

  <path d="M 380 462 L 380 484" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g3)" fill="none"/>

  <!-- fetch -->
  <rect x="120" y="488" width="520" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds3)"/>
  <text x="140" y="516" font-size="14.5" font-weight="700" fill="#0f172a">4 · Fetch</text>
  <text x="140" y="538" font-size="13" fill="#475569">redirects followed manually, max 10, every hop re-runs gates 1 and 2 · 32 MB / 60 s caps</text>

  <!-- refusal side-arrows -->
  <path d="M 120 210 L 64 210" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#r3)" fill="none"/>
  <path d="M 120 318 L 64 318" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#r3)" fill="none"/>
  <text x="58" y="268" font-size="13" fill="#dc2626" font-weight="700" text-anchor="end">refused</text>

  <!-- pacing note -->
  <rect x="120" y="580" width="520" height="76" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="140" y="608" font-size="13.5" font-weight="700" fill="#92400e">The wait at gate 3 is deliberately invisible to the agent.</text>
  <text x="140" y="630" font-size="13" fill="#92400e">Nothing to argue with, nothing to reason around, nothing to negotiate down.</text>
  <text x="140" y="650" font-size="13" fill="#92400e">(Operators are clamped too: the scan form caps the override at 100 req/s.)</text>
</svg>
