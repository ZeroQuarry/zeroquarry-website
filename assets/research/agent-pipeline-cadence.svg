<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The scan window either rides the merge or it's decoration</text>
  <text x="28" y="62" font-size="14" fill="#475569">Scanning is release-shaped because development was. Agents made development continuous.</text>

  <!-- Release era -->
  <text x="28" y="98" font-size="14" font-weight="700" fill="#334155">Release era</text>
  <line x1="40" y1="130" x2="720" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="118" width="80" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="80" y="134" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">scan</text>
  <rect x="128" y="118" width="80" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="168" y="134" font-size="11" fill="#334155" text-anchor="middle">release</text>
  <line x1="215" y1="118" x2="680" y2="118" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="380" y="104" width="180" height="20" rx="4" fill="#fef2f2"/>
  <text x="470" y="118" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">~11 months dark (human speed)</text>
  <rect x="688" y="118" width="24" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="136" font-size="10" fill="#334155" text-anchor="middle">r</text>
  <text x="40" y="162" font-size="12" fill="#475569">scan once, ship, breathe. The auditor's cadence and the attacker's cadence agreed by accident.</text>

  <!-- Agent era -->
  <text x="28" y="212" font-size="14" font-weight="700" fill="#334155">Agent era</text>
  <line x1="40" y1="250" x2="720" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#7c3aed" stroke-width="3">
    <line x1="70" y1="240" x2="70" y2="260"/>
    <line x1="120" y1="240" x2="120" y2="260"/>
    <line x1="185" y1="240" x2="185" y2="260"/>
    <line x1="230" y1="240" x2="230" y2="260"/>
    <line x1="310" y1="240" x2="310" y2="260"/>
    <line x1="355" y1="240" x2="355" y2="260"/>
    <line x1="420" y1="240" x2="420" y2="260"/>
    <line x1="500" y1="240" x2="500" y2="260"/>
    <line x1="545" y1="240" x2="545" y2="260"/>
    <line x1="610" y1="240" x2="610" y2="260"/>
    <line x1="665" y1="240" x2="665" y2="260"/>
    <line x1="700" y1="240" x2="700" y2="260"/>
  </g>
  <rect x="70" y="266" width="650" height="20" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="280" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">continuous merges -- the scan has to ride along (delta reviews of what changed)</text>
  <text x="40" y="308" font-size="12" fill="#475569">"before the release" is every hour. The gap between what changed and what got scanned is the exploit window.</text>

  <text x="380" y="352" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Agents didn't make this worse by coding badly. They made it worse by merging more.</text>
  <text x="380" y="372" font-size="12.5" fill="#64748b" text-anchor="middle">Eleven months a year unwatched was the human-speed number. It's the optimistic one now.</text>
</svg>
