<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1680" height="1150" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0f172a">Every request passes the gates</text>
  <text x="40" y="86" font-size="14.5" fill="#475569">The http_request pipeline. The model asks; deterministic code says yes or no, and the wait at gate 3 is deliberately invisible to the model.</text>

  <!-- ============ pipeline ============ -->
  <!-- agent -->
  <rect x="40" y="150" width="220" height="180" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="150" y="190" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">the agent</text>
  <text x="150" y="218" font-size="13" fill="#4c1d95" text-anchor="middle">http_request(url, method,</text>
  <text x="150" y="238" font-size="13" fill="#4c1d95" text-anchor="middle">headers, body ...)</text>
  <text x="150" y="272" font-size="12.5" fill="#4c1d95" text-anchor="middle">a target URL is a claim</text>
  <text x="150" y="290" font-size="12.5" fill="#4c1d95" text-anchor="middle">about the world, not a fact</text>
  <text x="150" y="308" font-size="12.5" fill="#4c1d95" text-anchor="middle">until the gates say so</text>

  <!-- gate 1 -->
  <rect x="300" y="130" width="270" height="220" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <rect x="320" y="150" width="110" height="28" rx="14" fill="#16a34a"/>
  <text x="375" y="169" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">GATE 1 · SCOPE</text>
  <g font-size="13" fill="#14532d">
    <text x="320" y="205">matched against scope_hosts</text>
    <text x="320" y="225">+ project scan policy patterns</text>
    <text x="320" y="255">runs BEFORE any DNS query</text>
    <text x="320" y="275">or socket activity</text>
    <text x="320" y="305" font-weight="600">malformed pattern = refuse</text>
    <text x="320" y="325" font-weight="600">(fail closed)</text>
  </g>

  <!-- gate 2 -->
  <rect x="610" y="130" width="290" height="220" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <rect x="630" y="150" width="110" height="28" rx="14" fill="#16a34a"/>
  <text x="685" y="169" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">GATE 2 · SSRF</text>
  <g font-size="13" fill="#14532d">
    <text x="630" y="205">http/https only · no user:pass@</text>
    <text x="630" y="225">.local / .internal / metadata blocked</text>
    <text x="630" y="255">resolve the hostname: EVERY</text>
    <text x="630" y="275">resolved IP must be globally routable</text>
    <text x="630" y="305" font-weight="600">resolver error = refuse;</text>
    <text x="630" y="325" font-weight="600">partial allowlists are a rebind bypass</text>
  </g>

  <!-- gate 3 -->
  <rect x="940" y="130" width="290" height="220" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <rect x="960" y="150" width="130" height="28" rx="14" fill="#16a34a"/>
  <text x="1025" y="169" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">GATE 3 · PACING</text>
  <g font-size="13" fill="#14532d">
    <text x="960" y="205">token bucket inside the tool,</text>
    <text x="960" y="225">built by the platform from scan</text>
    <text x="960" y="245">config; shared across the worker</text>
    <text x="960" y="275">default 5 req/s · form clamps</text>
    <text x="960" y="295">operators to 100/s</text>
    <text x="960" y="325" font-weight="600">the model never sees the wait</text>
  </g>

  <!-- fetch -->
  <rect x="1270" y="130" width="370" height="220" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" filter="url(#ds)"/>
  <text x="1455" y="170" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">fetch</text>
  <g font-size="13" fill="#334155">
    <text x="1290" y="205">redirects followed manually, max 10,</text>
    <text x="1290" y="225">every hop re-runs gates 1 and 2</text>
    <text x="1290" y="255">response caps: 32 MB · 60 s slow-drip</text>
    <text x="1290" y="285">response + auth_sent report: which</text>
    <text x="1290" y="305">credentials rode on this request</text>
  </g>

  <!-- pipeline arrows -->
  <path d="M 260 240 L 295 240" stroke="#475569" stroke-width="3" marker-end="url(#ah-slate)" fill="none"/>
  <path d="M 570 240 L 605 240" stroke="#475569" stroke-width="3" marker-end="url(#ah-slate)" fill="none"/>
  <path d="M 900 240 L 935 240" stroke="#475569" stroke-width="3" marker-end="url(#ah-slate)" fill="none"/>
  <path d="M 1230 240 L 1265 240" stroke="#475569" stroke-width="3" marker-end="url(#ah-slate)" fill="none"/>

  <!-- refusal arrows -->
  <path d="M 435 355 L 435 420 L 200 420" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ah-red)" fill="none"/>
  <path d="M 755 355 L 755 445 L 200 445" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ah-red)" fill="none"/>
  <text x="210" y="410" font-size="13" fill="#dc2626" font-weight="600">any refusal returns as a tool error the agent can pivot on: "blocked by scan scope: ..." / "SsrfBlocked: ..."</text>

  <!-- ============ shell envelope ============ -->
  <rect x="40" y="500" width="1600" height="270" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#ds)"/>
  <text x="70" y="545" font-size="19" font-weight="700" fill="#0f172a">The same discipline inside run_shell</text>
  <g font-size="14" fill="#334155">
    <text x="70" y="585">Binary denylist: curl, wget, nc, socat, ssh, scp, rsync, telnet, ftp, nmap, nuclei ... segment-aware parsing catches</text>
    <text x="70" y="607">"a &amp;&amp; curl ..." and E2BIG argv. Refusal text: "command '{blocked}' is not allowed in this scan mode. Use a local alternative."</text>
  </g>
  <g font-size="14" fill="#334155">
    <text x="70" y="647">Subcommand-aware: openssl x509 reads certificates; openssl s_client is refused. The tool knows the difference.</text>
    <text x="70" y="687">prlimit envelope on every invocation: 60 s wall · 1024 MB RSS · 60 CPU-seconds · 4096 processes. Runaway commands are</text>
    <text x="70" y="709">SIGKILLed and surface as a clean tool error with the resource budget noted, so the scan continues instead of dying.</text>
    <text x="70" y="749" font-weight="600" fill="#0f172a">For source and binary scans there is no http_request at all, three separate layers deny network tools, and the</text>
    <text x="70" y="771" font-weight="600" fill="#0f172a">container has no egress. The OS rule is the floor; the tool layer is the backstop, not the other way around.</text>
  </g>

  <!-- ============ who says no ============ -->
  <rect x="40" y="810" width="1600" height="300" rx="20" fill="#0f172a" filter="url(#ds)"/>
  <text x="70" y="855" font-size="19" font-weight="700" fill="#ffffff">Who can stop a request, and which stop we actually rely on</text>
  <g>
    <rect x="70" y="885" width="370" height="190" rx="14" fill="#1e293b"/>
    <text x="255" y="920" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">the model</text>
    <text x="255" y="950" font-size="13" fill="#cbd5e1" text-anchor="middle">asked first: briefed on scope,</text>
    <text x="255" y="970" font-size="13" fill="#cbd5e1" text-anchor="middle">pacing, and non-destructive</text>
    <text x="255" y="990" font-size="13" fill="#cbd5e1" text-anchor="middle">payloads</text>
    <text x="255" y="1022" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="middle">relied on last</text>

    <rect x="470" y="885" width="370" height="190" rx="14" fill="#1e293b"/>
    <text x="655" y="920" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">the brief</text>
    <text x="655" y="950" font-size="13" fill="#cbd5e1" text-anchor="middle">guard blocks appended by code</text>
    <text x="655" y="970" font-size="13" fill="#cbd5e1" text-anchor="middle">to every task, with reasons,</text>
    <text x="655" y="990" font-size="13" fill="#cbd5e1" text-anchor="middle">auditable in the scan record</text>
    <text x="655" y="1022" font-size="13" font-weight="600" fill="#fcd34d" text-anchor="middle">persuasion with a paper trail</text>

    <rect x="870" y="885" width="370" height="190" rx="14" fill="#1e293b"/>
    <text x="1055" y="920" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">the tool layer</text>
    <text x="1055" y="950" font-size="13" fill="#cbd5e1" text-anchor="middle">scope, SSRF, pacing, denylist,</text>
    <text x="1055" y="970" font-size="13" fill="#cbd5e1" text-anchor="middle">prlimit: deterministic refusal</text>
    <text x="1055" y="990" font-size="13" fill="#cbd5e1" text-anchor="middle">before any effect</text>
    <text x="1055" y="1022" font-size="13" font-weight="600" fill="#86efac" text-anchor="middle">the layer we rely on</text>

    <rect x="1270" y="885" width="370" height="190" rx="14" fill="#1e293b"/>
    <text x="1455" y="920" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">the container</text>
    <text x="1455" y="950" font-size="13" fill="#cbd5e1" text-anchor="middle">no egress where the scan type</text>
    <text x="1455" y="970" font-size="13" fill="#cbd5e1" text-anchor="middle">does not need it; read-only</text>
    <text x="1455" y="990" font-size="13" fill="#cbd5e1" text-anchor="middle">rootfs, dropped capabilities</text>
    <text x="1455" y="1022" font-size="13" font-weight="600" fill="#86efac" text-anchor="middle">the floor under everything</text>
  </g>
</svg>
