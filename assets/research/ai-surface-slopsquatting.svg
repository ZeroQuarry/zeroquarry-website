<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Slopsquatting: the name in your code is the attacker's opportunity</text>
  <text x="28" y="62" font-size="14" fill="#475569">Dependency confusion, regenerated nightly by a model that never checks whether the package exists.</text>

  <!-- Column 1: the model writes -->
  <rect x="28" y="86" width="220" height="190" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="44" y="112" font-size="14" font-weight="700" fill="#334155">1. The model writes</text>
  <rect x="42" y="126" width="192" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="148" font-size="11.5" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">import string-utils-pro</text>
  <text x="52" y="166" font-size="10.5" fill="#64748b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace"># does not exist. yet.</text>
  <text x="44" y="200" font-size="12" fill="#475569">plausible name, confident</text>
  <text x="44" y="218" font-size="12" fill="#475569">usage, invented package;</text>
  <text x="44" y="236" font-size="12" fill="#475569">the diff looks completely</text>
  <text x="44" y="254" font-size="12" fill="#475569">normal in review</text>

  <!-- Column 2: the check -->
  <rect x="286" y="86" width="220" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="302" y="112" font-size="14" font-weight="700" fill="#166534">2. The scan check</text>
  <rect x="300" y="126" width="192" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="396" y="149" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">registry lookup: no such package</text>
  <rect x="300" y="172" width="192" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="396" y="190" font-size="11.5" fill="#334155" text-anchor="middle">allowlist: private registries,</text>
  <text x="396" y="204" font-size="11.5" fill="#334155" text-anchor="middle">monorepo-internal names</text>
  <rect x="300" y="218" width="192" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="396" y="236" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">→ lead, not an alarm</text>
  <text x="396" y="252" font-size="11" fill="#4c1d95" text-anchor="middle">worth a human's ten seconds</text>

  <!-- Column 3: six weeks later -->
  <rect x="544" y="86" width="188" height="190" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#ds)"/>
  <text x="560" y="112" font-size="14" font-weight="700" fill="#991b1b">3. Six weeks later</text>
  <text x="560" y="136" font-size="12.5" fill="#7f1d1d">an attacker registers</text>
  <text x="560" y="154" font-size="12.5" fill="#7f1d1d">the same name and</text>
  <text x="560" y="172" font-size="12.5" fill="#7f1d1d">waits for installs.</text>
  <rect x="558" y="188" width="160" height="36" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="638" y="211" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">install = attacker code</text>
  <text x="560" y="246" font-size="11.5" fill="#7f1d1d">the line shipped in a</text>
  <text x="560" y="262" font-size="11.5" fill="#7f1d1d">clean diff weeks earlier</text>

  <line x1="252" y1="181" x2="282" y2="181" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="181" x2="540" y2="181" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Time arrow -->
  <line x1="40" y1="310" x2="720" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="330" font-size="12" fill="#64748b" text-anchor="middle">time</text>

  <text x="380" y="376" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">An unresolved import is usually boring: a monorepo-internal name or a private registry artifact.</text>
  <text x="380" y="396" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">That's exactly why it's a lead with an allowlist, not an alarm that gets muted.</text>
  <text x="380" y="420" font-size="12.5" fill="#64748b" text-anchor="middle">The check is mechanical. The judgment about whether the name is a risk is not, so it goes to the pipeline.</text>
</svg>
