<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Injection gets a deterministic producer, not a chat window</text>
  <text x="28" y="62" font-size="14" fill="#475569">Two clean-room rule classes feed the pipeline that already adjudicates and validates everything else.</text>

  <!-- Rule classes box -->
  <rect x="28" y="86" width="200" height="150" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="44" y="112" font-size="14" font-weight="700" fill="#334155">Clean-room rules</text>
  <rect x="40" y="124" width="176" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="142" font-size="11.5" font-weight="600" fill="#334155">untrusted content</text>
  <text x="50" y="158" font-size="11.5" fill="#475569">→ prompt construction</text>
  <rect x="40" y="176" width="176" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="194" font-size="11.5" font-weight="600" fill="#334155">model / tool output</text>
  <text x="50" y="210" font-size="11.5" fill="#475569">→ exec, shell, SQL, eval</text>

  <!-- Lead box -->
  <rect x="266" y="110" width="130" height="102" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="331" y="140" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">Lead</text>
  <text x="331" y="160" font-size="11.5" fill="#4c1d95" text-anchor="middle">a candidate,</text>
  <text x="331" y="176" font-size="11.5" fill="#4c1d95" text-anchor="middle">never a verdict</text>
  <text x="331" y="196" font-size="11.5" font-weight="600" fill="#5b21b6" text-anchor="middle">#1 on OWASP LLM</text>

  <!-- Adjudication box -->
  <rect x="434" y="110" width="140" height="102" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="504" y="136" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Coordinator</text>
  <text x="504" y="156" font-size="11.5" fill="#475569" text-anchor="middle">argues reachability,</text>
  <text x="504" y="172" font-size="11.5" fill="#475569" text-anchor="middle">context, control flow</text>
  <text x="504" y="192" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">kills the boring leads</text>

  <!-- Validation box -->
  <rect x="612" y="110" width="120" height="102" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="672" y="132" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">Adversarial</text>
  <text x="672" y="150" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">validation</text>
  <text x="672" y="170" font-size="11.5" fill="#14532d" text-anchor="middle">a reviewer whose</text>
  <text x="672" y="186" font-size="11.5" fill="#14532d" text-anchor="middle">job is to reject it</text>

  <line x1="228" y1="161" x2="262" y2="161" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="396" y1="161" x2="430" y2="161" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="574" y1="161" x2="608" y2="161" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- What the two wrong approaches do -->
  <rect x="28" y="248" width="342" height="118" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#ds)"/>
  <text x="44" y="274" font-size="14" font-weight="700" fill="#991b1b">Pure LLM scanning drowns</text>
  <text x="44" y="296" font-size="12.5" fill="#7f1d1d">every string near an LLM call looks suspicious,</text>
  <text x="44" y="314" font-size="12.5" fill="#7f1d1d">so everything is flagged and nothing is read</text>
  <text x="44" y="340" font-size="12.5" font-weight="600" fill="#991b1b">output: noise the team mutes</text>

  <rect x="390" y="248" width="342" height="118" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#ds)"/>
  <text x="406" y="274" font-size="14" font-weight="700" fill="#991b1b">Pure static analysis lies</text>
  <text x="406" y="296" font-size="12.5" fill="#7f1d1d">flags every flow syntactically, including the</text>
  <text x="406" y="314" font-size="12.5" fill="#7f1d1d">ten thousand that are harmless by construction</text>
  <text x="406" y="340" font-size="12.5" font-weight="600" fill="#991b1b">output: false confidence at scale</text>

  <text x="380" y="408" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">The rules produce candidates. Judgment happens where the evidence is:</text>
  <text x="380" y="428" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">in adjudication and adversarial validation, which already exist.</text>
  <text x="380" y="452" font-size="12.5" fill="#64748b" text-anchor="middle">Until now the pipeline had no candidates for the #1 item on the OWASP LLM list. That was ours to fix.</text>
</svg>
