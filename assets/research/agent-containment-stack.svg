<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Four layers around every scan agent</text>
  <text x="28" y="62" font-size="14" fill="#475569">Effects cross layers on the way out; none of the layers trust the model.</text>

  <!-- Layer 4: network -->
  <rect x="28" y="84" width="704" height="532" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="48" y="116" font-size="15.5" font-weight="700" fill="#334155">Network: outbound only</text>
  <text x="48" y="137" font-size="13.5" fill="#475569">Nothing connects in. One sanctioned callback door (the OOB collector).</text>

  <!-- Layer 3: container -->
  <rect x="56" y="156" width="648" height="436" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#ds)"/>
  <text x="76" y="188" font-size="15.5" font-weight="700" fill="#334155">Container: boring on purpose</text>
  <text x="76" y="209" font-size="13.5" fill="#475569">Non-root · read-only root filesystem · capabilities dropped · no host network or socket</text>

  <!-- Layer 2: tools -->
  <rect x="84" y="228" width="592" height="340" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="104" y="260" font-size="15.5" font-weight="700" fill="#166534">Tools: every effect goes through a gate</text>
  <text x="104" y="281" font-size="13.5" fill="#14532d">Scope check before any DNS or connection · SSRF guard · rate limiter</text>
  <text x="104" y="300" font-size="13.5" fill="#14532d">Shell denylist · time, memory, CPU, and process limits on every command</text>

  <!-- Layer 1: brief -->
  <rect x="112" y="322" width="536" height="222" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="132" y="354" font-size="15.5" font-weight="700" fill="#5b21b6">Brief: rules appended by code, every task</text>
  <text x="132" y="375" font-size="13.5" fill="#4c1d95">Scope and rate statement · OOB rules · session guard · registration rules</text>
  <text x="132" y="394" font-size="13.5" fill="#4c1d95">Stated with reasons, so the model cooperates with the design</text>

  <!-- agent -->
  <circle cx="380" cy="478" r="44" fill="#7c3aed" filter="url(#ds)"/>
  <text x="380" y="473" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">the agent</text>
  <text x="380" y="490" font-size="11.5" fill="#ede9fe" text-anchor="middle">decides</text>
  <text x="380" y="504" font-size="11.5" fill="#ede9fe" text-anchor="middle">where to look</text>

  <text x="380" y="592" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">The model is asked first and trusted last. Everything above it keeps working when it's wrong.</text>
</svg>
