<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="530" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Where the WPS Monitor code lives, and who scans there</text>
  <text x="28" y="62" font-size="14" fill="#475569">Every scanner category is legitimate. Only one of them looks inside the shipped firmware image.</text>

  <!-- column headers -->
  <text x="205" y="96" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">packages</text>
  <text x="320" y="96" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">source</text>
  <text x="435" y="96" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">live services</text>
  <text x="550" y="96" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">containers</text>
  <text x="665" y="88" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">shipped</text>
  <text x="665" y="104" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">firmware image</text>

  <!-- rows -->
  <!-- SCA -->
  <rect x="28" y="116" width="150" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="138" font-size="12.5" font-weight="700" fill="#334155">SBOM / SCA</text>
  <text x="42" y="156" font-size="11" fill="#64748b">inventories packages</text>
  <circle cx="205" cy="142" r="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="147" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓</text>
  <g fill="#fef2f2" stroke="#dc2626" stroke-width="1.5">
    <circle cx="320" cy="142" r="10"/><circle cx="435" cy="142" r="10"/><circle cx="550" cy="142" r="10"/><circle cx="665" cy="142" r="10"/>
  </g>
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">
    <text x="320" y="147">✕</text><text x="435" y="147">✕</text><text x="550" y="147">✕</text><text x="665" y="147">✕</text>
  </g>

  <!-- SAST -->
  <rect x="28" y="176" width="150" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="198" font-size="12.5" font-weight="700" fill="#334155">SAST</text>
  <text x="42" y="216" font-size="11" fill="#64748b">reads source</text>
  <circle cx="205" cy="202" r="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="207" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">✕</text>
  <circle cx="320" cy="202" r="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="207" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓</text>
  <g fill="#fef2f2" stroke="#dc2626" stroke-width="1.5">
    <circle cx="435" cy="202" r="10"/><circle cx="550" cy="202" r="10"/><circle cx="665" cy="202" r="10"/>
  </g>
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">
    <text x="435" y="207">✕</text><text x="550" y="207">✕</text><text x="665" y="207">✕</text>
  </g>

  <!-- DAST -->
  <rect x="28" y="236" width="150" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="258" font-size="12.5" font-weight="700" fill="#334155">DAST</text>
  <text x="42" y="276" font-size="11" fill="#64748b">probes named services</text>
  <circle cx="205" cy="262" r="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="205" y="267" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">✕</text>
  <circle cx="320" cy="262" r="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="267" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">✕</text>
  <circle cx="435" cy="262" r="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="267" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓</text>
  <g fill="#fef2f2" stroke="#dc2626" stroke-width="1.5">
    <circle cx="550" cy="262" r="10"/><circle cx="665" cy="262" r="10"/>
  </g>
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">
    <text x="550" y="267">✕</text><text x="665" y="267">✕</text>
  </g>

  <!-- container -->
  <rect x="28" y="296" width="150" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="42" y="318" font-size="12.5" font-weight="700" fill="#334155">Container scanning</text>
  <text x="42" y="336" font-size="11" fill="#64748b">registries and clusters</text>
  <g fill="#fef2f2" stroke="#dc2626" stroke-width="1.5">
    <circle cx="205" cy="322" r="10"/><circle cx="320" cy="322" r="10"/><circle cx="435" cy="322" r="10"/>
  </g>
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">
    <text x="205" y="327">✕</text><text x="320" y="327">✕</text><text x="435" y="327">✕</text>
  </g>
  <circle cx="550" cy="322" r="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="327" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">✓</text>
  <circle cx="665" cy="322" r="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="327" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">✕</text>

  <!-- binary -->
  <rect x="28" y="356" width="150" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="42" y="378" font-size="12.5" font-weight="700" fill="#166534">Firmware / binary</text>
  <text x="42" y="396" font-size="11" fill="#14532d">scans the artifact</text>
  <g fill="#fef2f2" stroke="#dc2626" stroke-width="1.5">
    <circle cx="205" cy="382" r="10"/><circle cx="320" cy="382" r="10"/><circle cx="435" cy="382" r="10"/><circle cx="550" cy="382" r="10"/>
  </g>
  <g font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">
    <text x="205" y="387">✕</text><text x="320" y="387">✕</text><text x="435" y="387">✕</text><text x="550" y="387">✕</text>
  </g>
  <circle cx="665" cy="382" r="12" fill="#16a34a"/>
  <text x="665" y="387" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>

  <!-- annotation -->
  <rect x="560" y="424" width="172" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="646" y="442" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">the WPS Monitor parser</text>
  <text x="646" y="458" font-size="11.5" fill="#7f1d1d" text-anchor="middle">has lived here since 2010</text>

  <text x="370" y="486" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">The vulnerable code was present, byte-for-byte, in every one of the affected</text>
  <text x="370" y="504" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">firmware images. Nothing was hidden. Nobody's job covered the column it lives in.</text>
</svg>
