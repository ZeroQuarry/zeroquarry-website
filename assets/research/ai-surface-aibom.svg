<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">AIBOM: the dependency your manifest never captured</text>
  <text x="28" y="62" font-size="14" fill="#475569">A pinned model is a real dependency. It has a license and vendor terms no lockfile records.</text>

  <!-- Code -->
  <rect x="28" y="90" width="220" height="150" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="44" y="116" font-size="14" font-weight="700" fill="#334155">In the code</text>
  <rect x="42" y="130" width="192" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="150" font-size="11.5" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">model = "qwen2.5-72b"</text>
  <rect x="42" y="168" width="192" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="188" font-size="11.5" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">provider = "huggingface"</text>
  <text x="44" y="224" font-size="12" fill="#475569">absent from every SBOM</text>

  <!-- Registry -->
  <rect x="286" y="90" width="220" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="302" y="116" font-size="14" font-weight="700" fill="#5b21b6">Curated registry</text>
  <text x="302" y="140" font-size="12" fill="#4c1d95" font-weight="600">Model license</text>
  <text x="302" y="156" font-size="11.5" fill="#4c1d95">from authoritative sources</text>
  <text x="302" y="176" font-size="12" fill="#4c1d95" font-weight="600">Provider terms</text>
  <text x="302" y="192" font-size="11.5" fill="#4c1d95">training-on-input? retention?</text>
  <text x="302" y="208" font-size="11.5" fill="#4c1d95">output-use restrictions?</text>
  <rect x="298" y="216" width="196" height="14" rx="4" fill="#ffffff" stroke="none"/>
  <text x="302" y="227" font-size="10.5" font-weight="600" fill="#5b21b6">unknown stays unknown, never guessed</text>

  <!-- Export -->
  <rect x="532" y="90" width="200" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="548" y="116" font-size="14" font-weight="700" fill="#166534">Export</text>
  <text x="548" y="140" font-size="12" fill="#14532d">CycloneDX ML-BOM</text>
  <text x="548" y="160" font-size="12" fill="#14532d">SPDX 3.0 AI profile</text>
  <rect x="548" y="176" width="168" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="632" y="199" font-size="10.5" font-weight="600" fill="#166534" text-anchor="middle">download beside the SBOM</text>
  <text x="548" y="232" font-size="10.5" fill="#14532d">an artifact, not a spreadsheet</text>

  <line x1="248" y1="165" x2="282" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="506" y1="165" x2="528" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="380" y="292" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">The questionnaire asks: which models does your product use, under what terms?</text>
  <text x="380" y="312" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Today the answer is produced by grep and hope. It should be an export that updates with the code.</text>

  <rect x="28" y="336" width="704" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="360" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">Same discipline as the SPDX alias table: conservative normalization.</text>
  <text x="380" y="380" font-size="12.5" fill="#92400e" text-anchor="middle">A model card that doesn't state a license ships as "license unknown", not as a cheerful default.</text>
</svg>
