<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1680" height="1120" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0f172a">One direction, one door</text>
  <text x="40" y="86" font-size="14.5" fill="#475569">A scan worker's entire network conversation. Green arrows exist; red arrows are refused by construction, not by policy.</text>

  <!-- ============ control plane ============ -->
  <rect x="540" y="120" width="560" height="150" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="820" y="158" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">ZeroQuarry control plane</text>
  <g font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="820" y="188">leases the job manifest over HTTPS</text>
    <text x="820" y="210">accepts results only for the active leased attempt</text>
    <text x="820" y="232">holds the OOB secret; derives the read key</text>
  </g>

  <!-- ============ worker ============ -->
  <rect x="540" y="400" width="560" height="230" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="820" y="440" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">scan worker container</text>
  <g font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="820" y="470">outbound claim loop; no listener, no open port</text>
    <text x="820" y="492">non-root · read-only rootfs · cap-drop ALL</text>
    <text x="820" y="514">http_request with scope + SSRF + rate-limit gates</text>
    <text x="820" y="536">mail_allocate / mail_poll · oob_allocate / oob_poll</text>
    <text x="820" y="558">redirect_allocate (first-party, per-nonce)</text>
  </g>
  <text x="820" y="602" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600">"no inbound firewall rule is required" is a property of the design, not the deployment</text>

  <!-- ============ target ============ -->
  <rect x="1240" y="400" width="400" height="230" rx="20" fill="#f8fafc" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="1440" y="440" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">authorized target</text>
  <g font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="1440" y="470">scope_hosts from DNS-verified domains</text>
    <text x="1440" y="492">or a signed engagement</text>
    <text x="1440" y="522">every request re-checked at the tool layer</text>
    <text x="1440" y="544">every redirect hop re-checked mid-chain</text>
    <text x="1440" y="574">private + metadata IPs refused on cloud scans</text>
  </g>

  <!-- ============ OOB collector ============ -->
  <rect x="540" y="770" width="560" height="200" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="820" y="808" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">OOB collector · the designed door</text>
  <g font-size="13.5" fill="#334155" text-anchor="middle">
    <text x="820" y="838">bin.zeroquarry.com / oob.zeroquarry.com + one delegated DNS zone</text>
    <text x="820" y="866">write path public on purpose: the payload must carry the callback URL</text>
    <text x="820" y="888">read path needs the X-ZQ-OOB-Read key; the target never gets it</text>
    <text x="820" y="910">unknown-nonce callbacks are stored as flagged noise, never proof</text>
    <text x="820" y="940" font-weight="600" fill="#166534">per scan: 200 probes · 50 redirects · 120 callbacks/min per token</text>
  </g>

  <!-- ============ green arrows ============ -->
  <path d="M 780 270 L 780 395" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)" fill="none"/>
  <text x="792" y="330" font-size="13" fill="#166534" font-weight="600">claim jobs (outbound HTTPS)</text>
  <path d="M 860 395 L 860 275" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)" fill="none"/>
  <text x="872" y="380" font-size="13" fill="#166534" font-weight="600">post results</text>

  <path d="M 1100 480 L 1235 480" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)" fill="none"/>
  <text x="1132" y="466" font-size="13" fill="#166534" font-weight="600">in-scope probes</text>
  <path d="M 1240 560 Q 1120 640 1010 610" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah-green)" fill="none"/>
  <text x="1088" y="648" font-size="12.5" fill="#166534">responses</text>

  <path d="M 740 630 L 740 765" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)" fill="none"/>
  <text x="560" y="690" font-size="13" fill="#166534" font-weight="600">allocate + poll (HTTPS)</text>
  <path d="M 900 765 L 900 635" stroke="#16a34a" stroke-width="3" marker-end="url(#ah-green)" fill="none"/>
  <text x="912" y="700" font-size="13" fill="#166534" font-weight="600">callbacks + reads</text>

  <!-- ============ blocked arrows ============ -->
  <path d="M 300 240 L 535 430" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)" fill="none"/>
  <text x="120" y="300" font-size="13.5" fill="#dc2626" font-weight="700">inbound connection</text>
  <text x="120" y="320" font-size="12.5" fill="#dc2626">nothing is listening; there is</text>
  <text x="120" y="338" font-size="12.5" fill="#dc2626">no port to knock on</text>

  <path d="M 1100 430 L 1440 330 L 1620 330" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)" fill="none"/>
  <text x="1470" y="310" font-size="13.5" fill="#dc2626" font-weight="700">169.254.169.254 · 10.0.0.0/8</text>
  <text x="1470" y="352" font-size="12.5" fill="#dc2626">metadata + private ranges,</text>
  <text x="1470" y="370" font-size="12.5" fill="#dc2626">refused at the tool layer</text>

  <path d="M 1240 620 Q 1400 700 1560 690" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)" fill="none"/>
  <text x="1420" y="730" font-size="13.5" fill="#dc2626" font-weight="700">redirect out of scope</text>
  <text x="1420" y="750" font-size="12.5" fill="#dc2626">"A 302 to http://127.0.0.1 is exactly</text>
  <text x="1420" y="768" font-size="12.5" fill="#dc2626">the SSRF payload this guard exists to stop"</text>

  <path d="M 300 940 L 535 890" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ah-red)" fill="none"/>
  <text x="90" y="912" font-size="13.5" fill="#dc2626" font-weight="700">any other host</text>
  <text x="90" y="932" font-size="12.5" fill="#dc2626">DNS server answers one delegated</text>
  <text x="90" y="950" font-size="12.5" fill="#dc2626">zone and REFUSED everything else;</text>
  <text x="90" y="968" font-size="12.5" fill="#dc2626">never behaves like an open resolver</text>

  <!-- ============ OOB invariants card ============ -->
  <rect x="1180" y="800" width="460" height="290" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#ds)"/>
  <text x="1210" y="840" font-size="16" font-weight="700" fill="#0f172a">Why the door cannot become a hole</text>
  <g font-size="13" fill="#334155">
    <text x="1210" y="872">Read key = HMAC-SHA256(secret, "oob-read:" + token).</text>
    <text x="1210" y="892">The token rides publicly in callback URLs; the key never does.</text>
    <text x="1210" y="922">Redirects fire only for nonces registered at allocation,</text>
    <text x="1210" y="942">by the key holder. "An open redirector for exactly nobody."</text>
    <text x="1210" y="972">Redirect chains give allocation-grade proof: a hit on the</text>
    <text x="1210" y="992">second nonce means the target followed the redirect.</text>
    <text x="1210" y="1022">Auth failures 404 identically to unknown tokens;</text>
    <text x="1210" y="1042">existence is never confirmed to a stranger.</text>
  </g>
</svg>
