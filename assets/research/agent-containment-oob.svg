<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Inside the OOB collector</text>
  <text x="28" y="62" font-size="14" fill="#475569">The proof of a blind finding arrives here; these are the rules that keep the door a door.</text>

  <!-- flow: target -> collector <- agent -->
  <rect x="40" y="92" width="180" height="88" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds2)"/>
  <text x="130" y="124" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">scanned target</text>
  <text x="130" y="146" font-size="12" fill="#475569" text-anchor="middle">sends the callback</text>
  <text x="130" y="162" font-size="12" fill="#475569" text-anchor="middle">(payload carried the URL)</text>

  <rect x="290" y="84" width="200" height="104" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5" filter="url(#ds2)"/>
  <text x="390" y="114" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">collector</text>
  <text x="390" y="136" font-size="12" fill="#14532d" text-anchor="middle">bin. / oob.zeroquarry.com</text>
  <text x="390" y="153" font-size="12" fill="#14532d" text-anchor="middle">+ one delegated DNS zone</text>
  <text x="390" y="174" font-size="12" fill="#14532d" text-anchor="middle">stores the raw request</text>

  <rect x="560" y="92" width="160" height="88" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#ds2)"/>
  <text x="640" y="124" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">the agent</text>
  <text x="640" y="146" font-size="12" fill="#475569" text-anchor="middle">allocated the nonce,</text>
  <text x="640" y="162" font-size="12" fill="#475569" text-anchor="middle">polls with its key</text>

  <path d="M 220 136 L 285 136" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g2)" fill="none"/>
  <path d="M 560 136 L 495 136" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g2)" fill="none"/>
  <text x="252" y="126" font-size="12" fill="#166534" text-anchor="middle" font-weight="600">write: public</text>
  <text x="528" y="126" font-size="12" fill="#166534" text-anchor="middle" font-weight="600">read: key</text>

  <!-- invariants -->
  <rect x="40" y="228" width="680" height="316" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#ds2)"/>
  <text x="64" y="264" font-size="15.5" font-weight="700" fill="#0f172a">The invariants</text>
  <g font-size="14" fill="#334155">
    <text x="64" y="298">The read key is derived as HMAC-SHA256 of the per-scan token. The token</text>
    <text x="64" y="318">rides publicly in callback URLs; the key never does.</text>
    <text x="64" y="350">A callback only counts as proof if its nonce was allocated by the agent</text>
    <text x="64" y="370">earlier in the same scan. A target that finds its own URL and spams it</text>
    <text x="64" y="390">produces stored, flagged noise -- never confirmation.</text>
    <text x="64" y="422">The redirector fires only for nonces registered at allocation by the key</text>
    <text x="64" y="442">holder: an open redirector for exactly nobody. A redirect chain proves</text>
    <text x="64" y="462">the target followed the redirect.</text>
    <text x="64" y="494">The DNS server answers one delegated zone and refuses everything else,</text>
    <text x="64" y="514">so it never behaves like an open resolver.</text>
  </g>

  <text x="380" y="576" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Metering is enforced in the harness, not asked for nicely: 200 probes · 50 redirects · 120 callbacks/min per scan.</text>
</svg>
