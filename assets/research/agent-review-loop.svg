<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" fill="#0f172a" font-weight="700">The review loop</text>
  <text x="28" y="62" font-size="14" fill="#475569">An independent sub-agent gets the change and nothing else. Then it hands back what it found.</text>

  <rect x="30" y="100" width="155" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="107" y="126" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">1. build</text>
  <text x="107" y="144" font-size="10.5" fill="#475569" text-anchor="middle">the agent writes it</text>
  <rect x="212" y="100" width="155" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="289" y="126" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">2. review</text>
  <text x="289" y="144" font-size="10.5" fill="#475569" text-anchor="middle">a sub-agent, not me</text>
  <text x="289" y="159" font-size="10.5" fill="#475569" text-anchor="middle">fresh context, read-only</text>
  <rect x="393" y="100" width="155" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="470" y="126" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">3. probe</text>
  <text x="470" y="144" font-size="10.5" fill="#475569" text-anchor="middle">reproduce it before</text>
  <text x="470" y="159" font-size="10.5" fill="#475569" text-anchor="middle">believing it</text>
  <rect x="574" y="100" width="155" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="651" y="126" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">4. fix</text>
  <text x="651" y="144" font-size="10.5" fill="#475569" text-anchor="middle">MUST FIX and</text>
  <text x="651" y="159" font-size="10.5" fill="#475569" text-anchor="middle">SHOULD FIX</text>
  <text x="651" y="174" font-size="10.5" fill="#475569" text-anchor="middle">CONSIDER doesn't block</text>
  <path d="M 187 144 L 208 144" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 369 144 L 390 144" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 144 L 571 144" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 651 188 L 651 210 L 107 210 L 107 190" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="380" y="232" font-size="11.5" fill="#166534" font-weight="600" text-anchor="middle">loop until there is no MUST FIX and no SHOULD FIX</text>
  <rect x="30" y="258" width="345" height="140" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="50" y="284" font-size="13.5" fill="#5b21b6" font-weight="700">The escape hatch</text>
  <text x="50" y="308" font-size="11" fill="#334155">3 rounds is the hard limit. When the loop hits it,</text>
  <text x="50" y="326" font-size="11" fill="#334155">the agent stops asking for another fix and hands it</text>
  <text x="50" y="344" font-size="11" fill="#334155">back to a human to look at.</text>
  <text x="50" y="372" font-size="11" fill="#5b21b6" font-weight="600">Most of the time the brief was the problem.</text>
  <rect x="385" y="258" width="345" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="405" y="284" font-size="13.5" fill="#166534" font-weight="700">Then a second model family</text>
  <text x="405" y="308" font-size="11" fill="#334155">The same PR goes to another independent LLM,</text>
  <text x="405" y="326" font-size="11" fill="#334155">a different family, reached over a CLI.</text>
  <text x="405" y="354" font-size="11" fill="#334155">Different priors see different bugs. The same model</text>
  <text x="405" y="372" font-size="11" fill="#334155">with more thinking just thinks longer.</text>
</svg>
