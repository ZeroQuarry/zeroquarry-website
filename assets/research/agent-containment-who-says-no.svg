<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Who can stop a request</text>
  <text x="28" y="62" font-size="14" fill="#475569">Listed in the order the design actually relies on them.</text>

  <rect x="28" y="84" width="704" height="300" rx="16" fill="#0f172a" filter="url(#ds6)"/>
  <g font-size="14.5" fill="#e2e8f0">
    <text x="56" y="124" font-weight="700" fill="#86efac">1 · The tool layer refuses, deterministically,</text>
    <text x="56" y="146" font-weight="700" fill="#86efac">before any DNS lookup or connection.</text>
    <text x="56" y="176">Scope, SSRF, pacing, denylist, resource limits. The layer we rely on.</text>
    <text x="56" y="216" font-weight="700" fill="#86efac">2 · The container has no egress where the scan</text>
    <text x="56" y="238" font-weight="700" fill="#86efac">type doesn't need it.</text>
    <text x="56" y="268">The floor under everything: some scan types never touch the network at all.</text>
    <text x="56" y="308" font-weight="700" fill="#fcd34d">3 · The brief states the rule, with the reason,</text>
    <text x="56" y="330" font-weight="700" fill="#fcd34d">so the model cooperates with the design.</text>
    <text x="56" y="360">The model is the first thing asked and the last thing trusted.</text>
  </g>
</svg>
