<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#cbd5e1" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="940" height="610" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">One year, three things you could buy</text>
  <text x="28" y="62" font-size="14" fill="#475569">Each row is a separate option, not three tests. The hatched span is the rest of the year.</text>

  <!-- row 1: cheap artifact -->
  <text x="28" y="112" font-size="15" font-weight="700" fill="#334155">The cheap report</text>
  <text x="28" y="131" font-size="12.5" fill="#64748b">one week · $3&#x2013;5k</text>
  <rect x="196" y="94" width="720" height="46" rx="8" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="196" y="94" width="14" height="46" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="222" y="122" font-size="13.5" font-weight="700" fill="#334155">2% of the year</text>

  <!-- row 2: normal pentest -->
  <text x="28" y="204" font-size="15" font-weight="700" fill="#334155">A normal pentest</text>
  <text x="28" y="223" font-size="12.5" fill="#64748b">one to two weeks</text>
  <rect x="196" y="186" width="720" height="46" rx="8" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="196" y="186" width="28" height="46" rx="4" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="236" y="214" font-size="13.5" font-weight="700" fill="#166534">4% of the year</text>

  <!-- row 3: good pentest -->
  <text x="28" y="296" font-size="15" font-weight="700" fill="#334155">A good pentest</text>
  <text x="28" y="315" font-size="12.5" fill="#64748b">three to four weeks</text>
  <rect x="196" y="278" width="720" height="46" rx="8" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="196" y="278" width="55" height="46" rx="4" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="263" y="306" font-size="13.5" font-weight="700" fill="#166534">8% of the year</text>

  <!-- week ruler -->
  <text x="196" y="352" font-size="11.5" fill="#94a3b8">week 1</text>
  <line x1="196" y1="358" x2="916" y2="358" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="916" y="352" font-size="11.5" fill="#94a3b8" text-anchor="end">week 52</text>

  <!-- bracket over the unexamined remainder of the best case -->
  <path d="M251 386 v14 h665 v-14" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="583" y="424" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="middle">The other eleven months</text>
  <text x="583" y="444" font-size="13" fill="#4c1d95" text-anchor="middle">Production code shipping changes, no human examining how it behaves</text>

  <!-- axis -->
  <line x1="196" y1="466" x2="916" y2="466" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="196" y="486" font-size="12.5" fill="#64748b">October</text>
  <text x="916" y="486" font-size="12.5" fill="#64748b" text-anchor="end">September</text>

  <rect x="28" y="512" width="888" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="540" font-size="13.5" fill="#334155">The best case on this chart still leaves nine in ten weeks of the year unexamined.</text>
  <text x="48" y="562" font-size="13.5" fill="#334155">The findings your team fixed in week three describe a codebase that mostly does not exist by December.</text>
</svg>