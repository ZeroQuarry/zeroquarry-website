<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The worker's whole network conversation</text>
  <text x="28" y="62" font-size="14" fill="#475569">Green arrows exist. Red arrows are refused by construction, not by policy.</text>

  <!-- control plane -->
  <rect x="215" y="84" width="330" height="104" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="380" y="116" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">ZeroQuarry control plane</text>
  <text x="380" y="140" font-size="13" fill="#475569" text-anchor="middle">leases jobs over HTTPS · accepts results</text>
  <text x="380" y="159" font-size="13" fill="#475569" text-anchor="middle">holds the OOB secret</text>

  <!-- worker -->
  <rect x="215" y="252" width="330" height="128" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="380" y="284" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="middle">scan worker container</text>
  <text x="380" y="308" font-size="13" fill="#475569" text-anchor="middle">dials out to claim jobs · nothing listens</text>
  <text x="380" y="327" font-size="13" fill="#475569" text-anchor="middle">non-root · read-only · capabilities dropped</text>
  <text x="380" y="346" font-size="13" fill="#475569" text-anchor="middle">every request passes the tool gates</text>

  <!-- target -->
  <rect x="588" y="252" width="144" height="128" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#ds)"/>
  <text x="660" y="284" font-size="14.5" font-weight="700" fill="#166534" text-anchor="middle">authorized</text>
  <text x="660" y="303" font-size="14.5" font-weight="700" fill="#166534" text-anchor="middle">target</text>
  <text x="660" y="327" font-size="12" fill="#14532d" text-anchor="middle">DNS-verified or</text>
  <text x="660" y="344" font-size="12" fill="#14532d" text-anchor="middle">signed engagement</text>

  <!-- OOB -->
  <rect x="215" y="446" width="330" height="112" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#ds)"/>
  <text x="380" y="478" font-size="15.5" font-weight="700" fill="#166534" text-anchor="middle">OOB collector · the one door</text>
  <text x="380" y="502" font-size="13" fill="#14532d" text-anchor="middle">callback write: public on purpose</text>
  <text x="380" y="521" font-size="13" fill="#14532d" text-anchor="middle">read: needs the key the target never gets</text>
  <text x="380" y="545" font-size="13" fill="#14532d" text-anchor="middle">per scan: 200 probes · 50 redirects · 120/min</text>

  <!-- green arrows -->
  <path d="M 340 188 L 340 247" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" fill="none"/>
  <path d="M 420 247 L 420 193" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" fill="none"/>
  <text x="290" y="222" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="600">claim jobs</text>
  <text x="478" y="222" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="600">post results</text>
  <path d="M 545 300 L 583 300" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" fill="none"/>
  <text x="564" y="288" font-size="12" fill="#166534" text-anchor="middle" font-weight="600">in-scope</text>
  <path d="M 340 380 L 340 441" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" fill="none"/>
  <path d="M 420 441 L 420 385" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)" fill="none"/>
  <text x="292" y="415" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="600">allocate / poll</text>
  <text x="486" y="415" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="600">callbacks</text>

  <!-- blocked arrows -->
  <path d="M 60 132 L 210 240" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#r)" fill="none"/>
  <text x="30" y="108" font-size="13" fill="#dc2626" font-weight="700">inbound:</text>
  <text x="30" y="126" font-size="12.5" fill="#dc2626">nothing is</text>
  <text x="30" y="142" font-size="12.5" fill="#dc2626">listening, no</text>
  <text x="30" y="158" font-size="12.5" fill="#dc2626">port to knock on</text>

  <path d="M 545 270 L 628 200 L 732 200" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#r)" fill="none"/>
  <text x="600" y="184" font-size="12.5" fill="#dc2626" font-weight="600">169.254.169.254 · 10.0.0.0/8 refused</text>

  <path d="M 588 366 Q 664 428 736 420" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#r)" fill="none"/>
  <text x="596" y="446" font-size="12.5" fill="#dc2626" font-weight="600">redirect out of scope:</text>
  <text x="596" y="463" font-size="12.5" fill="#dc2626">refused mid-chain</text>

  <text x="380" y="592" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">No inbound firewall rule is required -- that's a property of the design, not of the deployment.</text>
</svg>
