<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" fill="#0f172a" font-weight="700">The gate before production</text>
  <text x="28" y="62" font-size="14" fill="#475569">The build and the gate run in parallel. If either one fails, nothing on the production side runs.</text>

  <rect x="28" y="140" width="120" height="72" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="88" y="172" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">pushed code</text>
  <text x="88" y="192" font-size="11" fill="#64748b" text-anchor="middle">main branch</text>
  <rect x="192" y="104" width="196" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="290" y="138" font-size="13" fill="#334155" font-weight="700" text-anchor="middle">1. worker image build</text>
  <rect x="192" y="176" width="196" height="88" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="290" y="200" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">2. e2e gate</text>
  <text x="290" y="222" font-size="10.5" fill="#5b21b6" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">a real deployment,</text>
  <text x="290" y="240" font-size="10.5" fill="#5b21b6" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">not a mock</text>
  <rect x="460" y="140" width="272" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="596" y="172" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">3. production cutover</text>
  <text x="596" y="192" font-size="11.5" fill="#166534" text-anchor="middle">only if both passed</text>
  <path d="M 148 176 L 170 176 L 170 132 L 190 132" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 148 176 L 170 176 L 170 220 L 190 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 388 132 L 424 132 L 424 168 L 458 168" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 388 220 L 424 220 L 424 184 L 458 184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="288" width="704" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#ds)"/>
  <text x="380" y="318" font-size="13.5" fill="#991b1b" font-weight="700" text-anchor="middle">If either fails, the production steps never run.</text>
  <text x="380" y="342" font-size="11" fill="#991b1b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">not a restart, not a pull, not a migration</text>
  <text x="380" y="362" font-size="11" fill="#64748b" text-anchor="middle">the rollout is one command from pushed code to production</text>
</svg>
