<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="490" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The claim loop</text>
  <text x="28" y="62" font-size="14" fill="#475569">One model argues for, one argues against, and the round cap is enforced in code, not in a prompt.</text>

  <!-- researcher -->
  <rect x="28" y="92" width="220" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="138" y="120" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">Researcher agent</text>
  <text x="138" y="144" font-size="12.5" fill="#4c1d95" text-anchor="middle">builds the claim:</text>
  <text x="138" y="166" font-size="12" fill="#4c1d95" text-anchor="middle">what the bug is, where it is,</text>
  <text x="138" y="184" font-size="12" fill="#4c1d95" text-anchor="middle">and the evidence --</text>
  <text x="138" y="204" font-size="12" fill="#4c1d95" text-anchor="middle">a PoC, an HTTP sequence,</text>
  <text x="138" y="222" font-size="12" fill="#4c1d95" text-anchor="middle">a deployable test package</text>

  <!-- reviewer -->
  <rect x="400" y="92" width="220" height="150" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2.5" filter="url(#ds)"/>
  <text x="510" y="120" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Vendor-style reviewer</text>
  <text x="510" y="144" font-size="12.5" fill="#475569" text-anchor="middle">independent stage, own model,</text>
  <text x="510" y="162" font-size="12.5" fill="#475569" text-anchor="middle">no shared investigation context</text>
  <rect x="424" y="178" width="172" height="30" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="198" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">objective: reject the claim</text>
  <text x="510" y="228" font-size="11.5" fill="#64748b" text-anchor="middle">like a vendor rejecting a bad report</text>

  <!-- arrows between -->
  <line x1="248" y1="140" x2="396" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="130" font-size="11" fill="#475569" text-anchor="middle">claim + evidence</text>

  <!-- loop back -->
  <path d="M 400 218 Q 330 268 248 218" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="278" font-size="11.5" font-weight="600" fill="#92400e" text-anchor="middle">not convinced: needs more info / rejected</text>
  <text x="310" y="296" font-size="11.5" fill="#92400e" text-anchor="middle">repair with better evidence, or concede --</text>
  <text x="324" y="316" font-size="11.5" fill="#92400e" text-anchor="middle">bounded by a per-account round cap</text>

  <!-- convinced arrow down -->
  <line x1="510" y1="232" x2="510" y2="312" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="596" y="282" font-size="11.5" font-weight="600" fill="#166534">convinced</text>

  <!-- report box -->
  <rect x="400" y="316" width="220" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="510" y="342" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Report</text>
  <text x="510" y="364" font-size="12" fill="#14532d" text-anchor="middle">finding + severity + confidence</text>
  <text x="510" y="382" font-size="12" fill="#14532d" text-anchor="middle">+ the full argument behind it</text>

  <!-- dropped box -->
  <rect x="28" y="316" width="220" height="80" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="138" y="342" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Dropped</text>
  <text x="138" y="364" font-size="12" fill="#475569" text-anchor="middle">with reasons attached,</text>
  <text x="138" y="382" font-size="12" fill="#475569" text-anchor="middle">never silently deleted</text>

  <!-- transcript bar -->
  <rect x="28" y="420" width="704" height="48" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="440" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">The transcript accumulates the whole time:</text>
  <text x="380" y="458" font-size="12" fill="#475569" text-anchor="middle">which model played which role, at which stage, what the challenge was, what changed and why</text>
</svg>
