<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Severity and confidence are different numbers on purpose</text>
  <text x="28" y="62" font-size="14" fill="#475569">The two scores route to different work. Conflating them is what turns "200 findings" into an unusable queue.</text>

  <!-- axes -->
  <line x1="90" y1="380" x2="690" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="380" x2="90" y2="90" stroke="#334155" stroke-width="2"/>
  <text x="390" y="408" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">confidence (evidence the claim is real) →</text>
  <text x="60" y="240" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 60 240)">severity (impact if real) →</text>

  <!-- quadrant boxes -->
  <rect x="110" y="110" width="280" height="125" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#ds)"/>
  <text x="130" y="138" font-size="13.5" font-weight="700" fill="#991b1b">Critical + unproven</text>
  <text x="130" y="162" font-size="12.5" fill="#7f1d1d">more validation. paging someone</text>
  <text x="130" y="180" font-size="12.5" fill="#7f1d1d">about this is how queues lose trust.</text>
  <text x="130" y="210" font-size="12" font-weight="600" fill="#991b1b">→ back to the loop</text>

  <rect x="400" y="110" width="280" height="125" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="420" y="138" font-size="13.5" font-weight="700" fill="#166534">Critical + proven</text>
  <text x="420" y="162" font-size="12.5" fill="#14532d">survived rounds of attempted</text>
  <text x="420" y="180" font-size="12.5" fill="#14532d">rejection, reproduction attached</text>
  <text x="420" y="210" font-size="12" font-weight="600" fill="#166534">→ engineering ticket today</text>

  <rect x="110" y="245" width="280" height="125" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="130" y="273" font-size="13.5" font-weight="700" fill="#334155">Low + unproven</text>
  <text x="130" y="297" font-size="12.5" fill="#475569">archived with reasons attached,</text>
  <text x="130" y="315" font-size="12.5" fill="#475569">never silently deleted --</text>
  <text x="130" y="333" font-size="12.5" fill="#475569">the record answers "why?" later</text>
  <text x="130" y="357" font-size="12" font-weight="600" fill="#64748b">→ archive, auditable</text>

  <rect x="400" y="245" width="280" height="125" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="420" y="273" font-size="13.5" font-weight="700" fill="#334155">Medium + proven</text>
  <text x="420" y="297" font-size="12.5" fill="#475569">a working repro and a burned</text>
  <text x="420" y="315" font-size="12.5" fill="#475569">rebuttal is often worth more</text>
  <text x="420" y="333" font-size="12.5" fill="#475569">than an unproven high</text>
  <text x="420" y="357" font-size="12" font-weight="600" fill="#334155">→ ticket with evidence attached</text>

  <text x="380" y="430" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">A claim that survived three rounds of attempted rejection carries different confidence</text>
  <text x="380" y="450" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">than one that sailed through unchallenged, even at identical severity.</text>
</svg>
