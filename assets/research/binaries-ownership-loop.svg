<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Four true statements, arranged in a circle</text>
  <text x="28" y="62" font-size="14" fill="#475569">Everyone in the chain can truthfully say the bug is not theirs. The parser keeps accepting Wi-Fi frames.</text>

  <!-- center -->
  <circle cx="380" cy="250" r="86" fill="#fef2f2" stroke="#dc2626" stroke-width="3" filter="url(#ds)"/>
  <text x="380" y="240" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">the binary</text>
  <text x="380" y="260" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">nobody owns</text>
  <text x="380" y="280" font-size="11" fill="#7f1d1d" text-anchor="middle">still reachable,</text>
  <text x="380" y="295" font-size="11" fill="#7f1d1d" text-anchor="middle">1.5M+ devices in</text>
  <text x="380" y="310" font-size="11" fill="#7f1d1d" text-anchor="middle">Belgium alone</text>

  <!-- Broadcom -->
  <rect x="60" y="96" width="220" height="96" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="170" y="122" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Chip vendor</text>
  <text x="170" y="144" font-size="11.5" fill="#475569" text-anchor="middle">"Replaced with hostapd in 2018.</text>
  <text x="170" y="160" font-size="11.5" fill="#475569" text-anchor="middle">Obsolete, outside the support window."</text>
  <text x="170" y="180" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">→ declines the CVE</text>

  <!-- ODM -->
  <rect x="480" y="96" width="220" height="112" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="590" y="122" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">ODM</text>
  <text x="590" y="144" font-size="11.5" fill="#475569" text-anchor="middle">"We built the device to the</text>
  <text x="590" y="160" font-size="11.5" fill="#475569" text-anchor="middle">spec and the reference build</text>
  <text x="590" y="176" font-size="11.5" fill="#475569" text-anchor="middle">we were given."</text>
  <text x="590" y="200" font-size="10.5" fill="#64748b" text-anchor="middle">(and that build had WPS Monitor in it)</text>

  <!-- ISP -->
  <rect x="480" y="330" width="220" height="96" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="590" y="356" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">ISP</text>
  <text x="590" y="378" font-size="11.5" fill="#475569" text-anchor="middle">"We ship the vendor's firmware.</text>
  <text x="590" y="394" font-size="11.5" fill="#475569" text-anchor="middle">We don't build it, and the update</text>
  <text x="590" y="410" font-size="11.5" fill="#475569" text-anchor="middle">schedule isn't ours to set."</text>

  <!-- Device owner -->
  <rect x="60" y="330" width="220" height="96" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="170" y="356" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Device owner</text>
  <text x="170" y="378" font-size="11.5" fill="#475569" text-anchor="middle">"I can't patch this. The update</text>
  <text x="170" y="394" font-size="11.5" fill="#475569" text-anchor="middle">comes from my provider, and the</text>
  <text x="170" y="408" font-size="11.5" fill="#475569" text-anchor="middle">WPS toggle doesn't</text>
  <text x="170" y="421" font-size="11.5" fill="#475569" text-anchor="middle">remove the parser."</text>

  <!-- circular arrows -->
  <path d="M 282 130 Q 380 96 478 130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 590 210 Q 620 262 590 328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 478 392 Q 380 424 282 392" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 170 328 Q 140 262 170 194" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- spokes to center -->
  <line x1="282" y1="168" x2="308" y2="192" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="478" y1="168" x2="452" y2="192" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="282" y1="360" x2="308" y2="316" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="478" y1="360" x2="452" y2="316" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="380" y="446" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">A CVE requires a vendor willing to claim the affected code.</text>
  <text x="380" y="466" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Binary scanning requires nobody's permission: the bytes are right there.</text>
</svg>
