<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">Where the agent sits changes what it can find</text>
  <text x="28" y="62" font-size="14" fill="#475569">Same scanners on both sides. On the left, the model only ever sees what the pipeline produced.</text>

  <!-- left: pipeline -->
  <rect x="28" y="88" width="424" height="356" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="48" y="118" font-size="15.5" font-weight="700" fill="#334155">The usual shape</text>

  <rect x="52" y="142" width="120" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="112" y="170" font-size="12" fill="#334155" text-anchor="middle">SAST · SCA</text>

  <rect x="52" y="198" width="120" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="112" y="226" font-size="12" fill="#334155" text-anchor="middle">IaC · secrets</text>

  <line x1="176" y1="165" x2="222" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="176" y1="221" x2="222" y2="213" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="230" y="176" width="98" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="279" y="203" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">model</text>
  <text x="279" y="221" font-size="10.5" fill="#475569" text-anchor="middle">reads output</text>

  <line x1="332" y1="206" x2="374" y2="206" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>

  <rect x="382" y="176" width="52" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="408" y="203" font-size="11" fill="#334155" text-anchor="middle">a</text>
  <text x="408" y="221" font-size="11" fill="#334155" text-anchor="middle">report</text>

  <rect x="52" y="262" width="382" height="62" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="66" y="288" font-size="12.5" fill="#991b1b">If the scanner did not flag it, the model reading the</text>
  <text x="66" y="308" font-size="12.5" fill="#991b1b">output has no way to decide to go and look.</text>

  <rect x="52" y="340" width="382" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="243" y="368" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle">"AI-powered scanning"</text>

  <!-- right: tools for the agent -->
  <rect x="488" y="88" width="424" height="356" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="508" y="118" font-size="15.5" font-weight="700" fill="#166534">The ZeroQuarry shape</text>

  <circle cx="700" cy="222" r="46" fill="#16a34a" filter="url(#ds)"/>
  <text x="700" y="209" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">the agent</text>
  <text x="700" y="227" font-size="10.5" fill="#dcfce7" text-anchor="middle">decides what</text>
  <text x="700" y="241" font-size="10.5" fill="#dcfce7" text-anchor="middle">to call next</text>

  <!-- tool chips -->
  <rect x="512" y="140" width="128" height="34" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="576" y="162" font-size="11.5" fill="#166534" text-anchor="middle">SAST · SCA</text>

  <rect x="760" y="140" width="128" height="34" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="824" y="162" font-size="11.5" fill="#166534" text-anchor="middle">IaC · secrets</text>

  <rect x="512" y="184" width="128" height="34" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="576" y="206" font-size="11.5" fill="#166534" text-anchor="middle">fuzzing</text>

  <rect x="760" y="184" width="128" height="34" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="824" y="206" font-size="11.5" fill="#166534" text-anchor="middle">running app</text>

  <rect x="512" y="228" width="128" height="34" rx="8" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="576" y="250" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">OOB callback</text>

  <rect x="760" y="228" width="128" height="34" rx="8" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="824" y="250" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">N e-mail accounts</text>

  <line x1="644" y1="157" x2="668" y2="196" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="756" y1="157" x2="732" y2="196" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="644" y1="201" x2="666" y2="214" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="756" y1="201" x2="734" y2="214" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="644" y1="245" x2="662" y2="240" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="756" y1="245" x2="738" y2="240" stroke="#7c3aed" stroke-width="1.5"/>

  <rect x="512" y="286" width="376" height="62" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="526" y="310" font-size="12.5" fill="#5b21b6">The two purple tools are the ones a pipeline cannot</text>
  <text x="526" y="330" font-size="12.5" fill="#5b21b6">use: they need an agent choosing to use them.</text>

  <rect x="512" y="340" width="376" height="46" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="700" y="368" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">"scanning-enabled AI"</text>

  <text x="470" y="484" font-size="13.5" fill="#334155" text-anchor="middle">Same six scanners. The difference is who decides which one to pick, and whether anything new is available to pick.</text>
  <text x="470" y="510" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="middle">The tools are the tools. The reasoning is the product.</text>
</svg>