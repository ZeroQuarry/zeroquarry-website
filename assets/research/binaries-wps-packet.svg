<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The overflow, step by step</text>
  <text x="28" y="62" font-size="14" fill="#475569">Fragments arrive; reassembly trusts them; the buffer is fixed-size.</text>

  <!-- fragments arriving -->
  <rect x="28" y="96" width="180" height="200" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="118" y="124" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">In radio range:</text>
  <text x="118" y="146" font-size="11.5" fill="#475569" text-anchor="middle">fragment 1 of the</text>
  <text x="118" y="164" font-size="11.5" fill="#475569" text-anchor="middle">EAP-WPS handshake</text>
  <rect x="52" y="180" width="132" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="66" y="200" width="104" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="52" y="220" width="120" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="80" y="240" width="90" height="14" rx="4" fill="#cbd5e1"/>
  <text x="118" y="272" font-size="11" fill="#64748b" text-anchor="middle">no password, no pairing,</text>
  <text x="118" y="286" font-size="11" fill="#64748b" text-anchor="middle">no user interaction</text>

  <line x1="208" y1="196" x2="236" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reassembly buffer with overflow -->
  <rect x="240" y="96" width="240" height="200" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="360" y="124" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Reassembly into a fixed buffer</text>
  <rect x="268" y="150" width="184" height="64" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="186" font-size="11.5" fill="#475569" text-anchor="middle">the destination buffer</text>
  <rect x="268" y="150" width="184" height="26" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="360" y="168" font-size="11" fill="#1e3a8a" text-anchor="middle">reassembled size, unchecked</text>
  <rect x="268" y="214" width="184" height="18" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="360" y="228" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">spills past the buffer edge</text>
  <text x="360" y="258" font-size="11" fill="#475569" text-anchor="middle">the parser never constrains</text>
  <text x="360" y="274" font-size="11" fill="#475569" text-anchor="middle">the reassembled size to the buffer</text>

  <line x1="480" y1="196" x2="508" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- results -->
  <rect x="512" y="96" width="220" height="200" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#ds)"/>
  <text x="622" y="124" font-size="13.5" font-weight="700" fill="#991b1b" text-anchor="middle">What the overflow buys</text>
  <text x="622" y="152" font-size="12" fill="#7f1d1d" text-anchor="middle">1. controlled memory</text>
  <text x="622" y="170" font-size="12" fill="#7f1d1d" text-anchor="middle">disclosure: the Wi-Fi key</text>
  <text x="622" y="198" font-size="12" fill="#7f1d1d" text-anchor="middle">2. pre-auth code execution:</text>
  <text x="622" y="216" font-size="12" fill="#7f1d1d" text-anchor="middle">root on the router</text>
  <text x="622" y="252" font-size="11" fill="#475569" text-anchor="middle">no user within a mile of it</text>

  <!-- bottom banner -->
  <rect x="28" y="330" width="704" height="56" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="354" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Demoed by Quentin Kaiser at Hexacon, October 16, 2026:</text>
  <text x="380" y="374" font-size="12" fill="#475569" text-anchor="middle">Wi-Fi key extraction on an Orange Belgium Askey TCG3000; root on a Proximus BBOX3V+ from across the street</text>

  <text x="380" y="428" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">And the settings toggle is advisory:</text>
  <text x="380" y="448" font-size="12" fill="#475569" text-anchor="middle">the parser runs whether or not the user turned WPS off.</text>
</svg>
