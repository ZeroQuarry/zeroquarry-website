<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">From across the street: the packet path</text>
  <text x="28" y="62" font-size="14" fill="#475569">Every step happens before authentication. Radio proximity is the only requirement.</text>

  <!-- attacker -->
  <rect x="28" y="100" width="150" height="120" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="103" y="130" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Attacker</text>
  <text x="103" y="152" font-size="12" fill="#475569" text-anchor="middle">laptop with a radio,</text>
  <text x="103" y="170" font-size="12" fill="#475569" text-anchor="middle">parked outside</text>
  <text x="103" y="198" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">no password</text>

  <!-- frames -->
  <rect x="216" y="100" width="150" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="291" y="130" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">EAP-WPS frames</text>
  <text x="291" y="152" font-size="12" fill="#475569" text-anchor="middle">the pairing protocol,</text>
  <text x="291" y="170" font-size="12" fill="#475569" text-anchor="middle">sent fragmented</text>
  <text x="291" y="198" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">no enrollment needed</text>

  <!-- parser -->
  <rect x="404" y="100" width="160" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#ds)"/>
  <text x="484" y="126" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">WPS Monitor</text>
  <text x="484" y="148" font-size="12" fill="#7f1d1d" text-anchor="middle">reassembles fragments</text>
  <text x="484" y="166" font-size="12" fill="#7f1d1d" text-anchor="middle">into a fixed buffer,</text>
  <text x="484" y="184" font-size="12" fill="#7f1d1d" text-anchor="middle">no bounds check on</text>
  <text x="484" y="202" font-size="12" fill="#7f1d1d" text-anchor="middle">the reassembled size</text>

  <!-- impact -->
  <rect x="602" y="100" width="130" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#ds)"/>
  <text x="667" y="126" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Impact</text>
  <text x="667" y="148" font-size="11.5" fill="#7f1d1d" text-anchor="middle">memory disclosure</text>
  <text x="667" y="164" font-size="11.5" fill="#7f1d1d" text-anchor="middle">(the Wi-Fi key)</text>
  <text x="667" y="192" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">code execution</text>
  <text x="667" y="208" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">(root)</text>

  <line x1="178" y1="160" x2="212" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="366" y1="160" x2="400" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="160" x2="598" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- radio arcs from attacker to frames -->
  <path d="M 180 145 q 12 -18 34 -18" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- bottom banner -->
  <rect x="28" y="250" width="704" height="66" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="276" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Demoed by Quentin Kaiser at Hexacon, October 16, 2026</text>
  <text x="380" y="296" font-size="12.5" fill="#475569" text-anchor="middle">Wi-Fi key extraction on an Orange Belgium Askey TCG3000 · root on a Proximus BBOX3V+ "from across the street"</text>

  <text x="380" y="348" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">Disabling the WPS toggle in settings may not remove the parser:</text>
  <text x="380" y="368" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">the parser doesn't check whether you've decided it shouldn't run.</text>
</svg>
