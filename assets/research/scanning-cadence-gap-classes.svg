<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The bugs that need two actors or a sequence</text>
  <text x="28" y="62" font-size="14" fill="#475569">Each individual step looks correct. The bug is in the relationship between steps.</text>

  <!-- panel 1: two actors -->
  <rect x="28" y="88" width="432" height="392" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#ds)"/>
  <text x="48" y="116" font-size="15.5" font-weight="700" fill="#5b21b6">Two actors: authorization</text>

  <circle cx="92" cy="164" r="26" fill="#7c3aed"/>
  <text x="92" y="169" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="92" y="204" font-size="12.5" fill="#4c1d95" text-anchor="middle">account A</text>

  <circle cx="92" cy="290" r="26" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="92" y="295" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">B</text>
  <text x="92" y="330" font-size="12.5" fill="#4c1d95" text-anchor="middle">account B</text>

  <!-- invoices -->
  <rect x="250" y="200" width="180" height="96" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="340" y="228" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">B's invoices</text>
  <text x="340" y="250" font-size="12" fill="#64748b" text-anchor="middle">GET /api/invoices/b_8812</text>
  <text x="340" y="272" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">200 OK · B's data</text>

  <line x1="120" y1="170" x2="242" y2="212" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)"/>
  <line x1="120" y1="292" x2="242" y2="284" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <text x="198" y="180" font-size="11.5" fill="#475569" text-anchor="middle">authenticated</text>

  <rect x="48" y="360" width="392" height="112" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="64" y="384" font-size="12.5" fill="#4c1d95">Both requests are well formed. A carries a valid token.</text>
  <text x="64" y="404" font-size="12.5" fill="#4c1d95">Nothing in either request looks wrong on its own.</text>
  <text x="64" y="432" font-size="12.5" font-weight="700" fill="#5b21b6">"Should A see this?" is a question about</text>
  <text x="64" y="452" font-size="12.5" font-weight="700" fill="#5b21b6">your business, not about your syntax.</text>

  <!-- panel 2: sequence -->
  <rect x="480" y="88" width="432" height="392" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#ds)"/>
  <text x="500" y="116" font-size="15.5" font-weight="700" fill="#166534">A sequence: business logic</text>

  <rect x="500" y="146" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="575" y="171" font-size="12.5" fill="#166534" text-anchor="middle">checkout</text>

  <line x1="650" y1="166" x2="698" y2="166" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="674" y="156" font-size="10.5" fill="#15803d" text-anchor="middle">paid</text>

  <rect x="706" y="146" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="781" y="171" font-size="12.5" fill="#166534" text-anchor="middle">payment captured</text>

  <line x1="781" y1="186" x2="781" y2="248" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="793" y="222" font-size="10.5" fill="#15803d">after</text>

  <rect x="706" y="256" width="150" height="40" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
  <text x="781" y="281" font-size="12.5" fill="#166534" text-anchor="middle">refund issued</text>

  <!-- the bad path -->
  <path d="M575 186 v34 h206 v36" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="672" y="242" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="middle">skips the capture step</text>

  <rect x="500" y="360" width="392" height="112" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="516" y="384" font-size="12.5" fill="#166534">Each box on its own is a legitimate operation.</text>
  <text x="516" y="404" font-size="12.5" fill="#166534">Nothing in any single handler is missing a check.</text>
  <text x="516" y="432" font-size="12.5" font-weight="700" fill="#15803d">The defect is the path, and a rule needs</text>
  <text x="516" y="452" font-size="12.5" font-weight="700" fill="#15803d">to know every path in order to see it.</text>

  <text x="470" y="512" font-size="13.5" fill="#334155" text-anchor="middle">These are the classes a scanner finds least, and the ones someone with judgment finds first.</text>
</svg>