<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">One finding's record, start to finish</text>
  <text x="28" y="62" font-size="14" fill="#475569">Every step carries its actor, its stage, and its reason. This is the artifact an auditor asks for.</text>

  <!-- spine -->
  <line x1="60" y1="96" x2="60" y2="440" stroke="#94a3b8" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="60" cy="100" r="7" fill="#7c3aed"/>
  <text x="84" y="94" font-size="13" font-weight="700" fill="#334155">candidate</text>
  <text x="84" y="112" font-size="12" fill="#475569">researcher agent: claims SSRF in the export path</text>

  <!-- step 2 -->
  <circle cx="60" cy="152" r="7" fill="#dc2626"/>
  <text x="84" y="146" font-size="13" font-weight="700" fill="#991b1b">challenged</text>
  <text x="84" y="164" font-size="12" fill="#475569">vendor reviewer: needs more info -- sink reachable?</text>

  <!-- step 3 -->
  <circle cx="60" cy="204" r="7" fill="#7c3aed"/>
  <text x="84" y="198" font-size="13" font-weight="700" fill="#334155">rebuttal</text>
  <text x="84" y="216" font-size="12" fill="#475569">researcher: HTTP sequence shows the callback fires</text>

  <!-- step 4 -->
  <circle cx="60" cy="256" r="7" fill="#16a34a"/>
  <text x="84" y="250" font-size="13" font-weight="700" fill="#166534">validated</text>
  <text x="84" y="268" font-size="12" fill="#475569">reviewer concedes: "reproduction confirms"; confidence raised, severity held at high</text>

  <!-- step 5 -->
  <circle cx="60" cy="308" r="7" fill="#475569"/>
  <text x="84" y="302" font-size="13" font-weight="700" fill="#334155">routed</text>
  <text x="84" y="320" font-size="12" fill="#475569">ticket filed to the project tracker with the transcript and evidence attached</text>

  <!-- step 6 -->
  <circle cx="60" cy="360" r="7" fill="#475569"/>
  <text x="84" y="354" font-size="13" font-weight="700" fill="#334155">fixed</text>
  <text x="84" y="372" font-size="12" fill="#475569">fix proposed as a pull request; merged under the project's own review rules</text>

  <!-- step 7 -->
  <circle cx="60" cy="412" r="7" fill="#16a34a"/>
  <text x="84" y="406" font-size="13" font-weight="700" fill="#166534">retested</text>
  <text x="84" y="424" font-size="12" fill="#475569">focused rescan of the finding: fixed; lifecycle closed with the retest evidence</text>

  <!-- step 8 -->
  <circle cx="60" cy="464" r="7" fill="#334155"/>
  <text x="84" y="458" font-size="13" font-weight="700" fill="#334155">provable</text>
  <text x="84" y="476" font-size="12" fill="#475569">exported as evidence: "when was this tested, by what, and what happened" has a file as its answer</text>

  <!-- side note -->
  <rect x="420" y="92" width="312" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="440" y="118" font-size="13" font-weight="700" fill="#991b1b">A sibling claim that didn't survive:</text>
  <text x="440" y="142" font-size="12" fill="#7f1d1d">rejected at round 2 -- the rebuttal could not</text>
  <text x="440" y="160" font-size="12" fill="#7f1d1d">distinguish the bug from response caching.</text>
  <text x="440" y="184" font-size="12" font-weight="700" fill="#991b1b">Dropped with the reason attached.</text>
  <text x="440" y="204" font-size="12" fill="#7f1d1d">Never silently deleted.</text>

  <text x="380" y="504" font-size="0" fill="none"> </text>
</svg>
