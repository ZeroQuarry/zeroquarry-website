<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1680" height="1180" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="40" y="58" font-size="28" font-weight="700" fill="#0f172a">The leash, layer by layer</text>
  <text x="40" y="86" font-size="14.5" fill="#475569">Every effect a scan agent can have on the world crosses at least four layers. The model is only the innermost one, and none of the layers trust it.</text>

  <!-- ============ nested containment rings ============ -->
  <!-- Layer 1: network (outermost) -->
  <rect x="40" y="120" width="1060" height="980" rx="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <rect x="66" y="146" width="150" height="30" rx="15" fill="#475569"/>
  <text x="141" y="166" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 4 · NETWORK</text>
  <text x="66" y="205" font-size="14" fill="#334155">Outbound only. Nothing connects in; there is no listener to answer.</text>
  <text x="66" y="226" font-size="14" fill="#334155">Workers claim jobs by dialing the control plane. The single sanctioned callback</text>
  <text x="66" y="247" font-size="14" fill="#334155">channel is the OOB collector: write path public, read path key-gated, DNS zone closed.</text>

  <!-- Layer 2: container -->
  <rect x="100" y="290" width="960" height="770" rx="24" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#ds)"/>
  <rect x="126" y="316" width="160" height="30" rx="15" fill="#475569"/>
  <text x="206" y="336" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 3 · CONTAINER</text>
  <text x="126" y="375" font-size="14" fill="#334155">Non-root uid 10001 · read-only root filesystem · one writable scratch dir</text>
  <text x="126" y="396" font-size="14" fill="#334155">--cap-drop ALL · no-new-privileges · pids-limit 512 · no docker.sock · no host network</text>
  <text x="126" y="417" font-size="14" fill="#334155">Credentials arrive in the leased job manifest, live for the attempt, deleted on exit</text>

  <!-- Layer 3: tool layer -->
  <rect x="160" y="450" width="860" height="570" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <rect x="186" y="476" width="130" height="30" rx="15" fill="#16a34a"/>
  <text x="251" y="496" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 2 · TOOLS</text>
  <text x="186" y="535" font-size="14" fill="#334155">Every capability is a registered tool with validation before effect:</text>
  <text x="186" y="556" font-size="14" fill="#334155">scope check (before DNS) · SSRF guard (all resolved IPs public, every hop re-checked)</text>
  <text x="186" y="577" font-size="14" fill="#334155">rate limiter (platform-built token bucket) · shell denylist (subcommand-aware)</text>
  <text x="186" y="598" font-size="14" fill="#334155">prlimit envelope on every command: 60 s wall · 1 GB · 60 CPU-s · 4096 procs</text>

  <!-- gate glyphs on the tool ring -->
  <g font-size="12.5" font-weight="600">
    <rect x="452" y="700" width="96" height="26" rx="13" fill="#16a34a"/>
    <text x="500" y="717" fill="#ffffff" text-anchor="middle">scope: in?</text>
    <rect x="452" y="738" width="126" height="26" rx="13" fill="#16a34a"/>
    <text x="515" y="755" fill="#ffffff" text-anchor="middle">SSRF: public?</text>
    <rect x="452" y="776" width="120" height="26" rx="13" fill="#16a34a"/>
    <text x="512" y="793" fill="#ffffff" text-anchor="middle">paced: 5 req/s</text>
  </g>

  <!-- Layer 4: brief (innermost ring around the model) -->
  <rect x="220" y="630" width="200" height="290" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <rect x="240" y="650" width="120" height="28" rx="14" fill="#7c3aed"/>
  <text x="300" y="669" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">LAYER 1 · BRIEF</text>
  <text x="240" y="704" font-size="12.5" fill="#4c1d95">Rules appended by code:</text>
  <text x="240" y="722" font-size="12.5" fill="#4c1d95">scope + rate statement,</text>
  <text x="240" y="740" font-size="12.5" fill="#4c1d95">OOB block, session guard,</text>
  <text x="240" y="758" font-size="12.5" fill="#4c1d95">registration rules.</text>
  <text x="240" y="786" font-size="12.5" font-weight="600" fill="#4c1d95">Persuasion has a</text>
  <text x="240" y="804" font-size="12.5" font-weight="600" fill="#4c1d95">paper trail: the brief</text>
  <text x="240" y="822" font-size="12.5" font-weight="600" fill="#4c1d95">is in the scan record.</text>

  <!-- agent core -->
  <circle cx="300" cy="902" r="62" fill="#7c3aed" filter="url(#ds)"/>
  <text x="300" y="894" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">the agent</text>
  <text x="300" y="912" font-size="11" fill="#ede9fe" text-anchor="middle">decides where</text>
  <text x="300" y="927" font-size="11" fill="#ede9fe" text-anchor="middle">to look</text>

  <!-- outward arrows from agent through layers -->
  <path d="M 360 886 L 470 760" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah-violet)" fill="none"/>
  <path d="M 620 760 L 900 620" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ah-green)" fill="none"/>
  <path d="M 940 590 L 1010 420" stroke="#475569" stroke-width="2.5" marker-end="url(#ah-slate)" fill="none"/>
  <path d="M 1050 400 L 1060 300" stroke="#475569" stroke-width="2.5" marker-end="url(#ah-slate)" fill="none"/>
  <text x="640" y="742" font-size="12.5" fill="#7c3aed" font-weight="600">tool call</text>
  <text x="905" y="580" font-size="12.5" fill="#16a34a" font-weight="600">validated HTTP</text>
  <text x="1005" y="360" font-size="12.5" fill="#475569" font-weight="600">egress</text>

  <!-- ============ right column: what the agent never holds ============ -->
  <rect x="1140" y="120" width="500" height="560" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#ds)"/>
  <text x="1170" y="162" font-size="18" font-weight="700" fill="#0f172a">What the agent never holds</text>
  <g font-size="14" fill="#334155">
    <text x="1170" y="200">The OOB read key. Derived as HMAC-SHA256 of the</text>
    <text x="1170" y="220">per-scan token; the scanned target never receives it,</text>
    <text x="1170" y="240">so it can poison its own namespace but not read it.</text>
    <text x="1170" y="286">Target credentials. Delivered in the leased job</text>
    <text x="1170" y="306">manifest over HTTPS, stored only for the attempt,</text>
    <text x="1170" y="326">deleted when execution exits, never in results.</text>
    <text x="1170" y="372">spawn_worker. Only the coordinator can mint</text>
    <text x="1170" y="392">workers, and only into the three audited types.</text>
    <text x="1170" y="438">The host. No docker.sock, no host network,</text>
    <text x="1170" y="458">no shared PID namespace with the control plane.</text>
    <text x="1170" y="504">The out-of-scope internet. Source and binary</text>
    <text x="1170" y="524">workers have no network tool at all, and their</text>
    <text x="1170" y="544">containers have no egress as the floor of defense.</text>
  </g>
  <rect x="1170" y="580" width="440" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1190" y="609" font-size="13.5" font-weight="600" fill="#0f172a">"The Docker image is not a sandbox."</text>
  <text x="1190" y="631" font-size="13" fill="#475569">Our own ops doc says it first. The boundary is the stack,</text>
  <text x="1190" y="649" font-size="13" fill="#475569">not any one wall of it.</text>

  <!-- ============ bottom band: the enforcement rule ============ -->
  <rect x="1140" y="710" width="500" height="390" rx="22" fill="#0f172a" filter="url(#ds)"/>
  <text x="1170" y="758" font-size="17" font-weight="700" fill="#ffffff">Who says no, in order of reliance</text>
  <g font-size="14" fill="#e2e8f0">
    <text x="1170" y="798">1. The tool layer refuses, deterministically,</text>
    <text x="1170" y="820">    before any DNS or socket activity.</text>
    <text x="1170" y="856">2. The container has no egress where the</text>
    <text x="1170" y="878">    scan type does not need it.</text>
    <text x="1170" y="914">3. The brief states the rule, with the reason,</text>
    <text x="1170" y="936">    so the model is cooperating with the</text>
    <text x="1170" y="958">    design rather than substituting for it.</text>
  </g>
  <text x="1170" y="1002" font-size="13.5" fill="#94a3b8">The model is the first thing asked and the last</text>
  <text x="1170" y="1024" font-size="13.5" fill="#94a3b8">thing trusted. Every layer above it keeps working</text>
  <text x="1170" y="1046" font-size="13.5" fill="#94a3b8">on the step where the model is wrong, confused,</text>
  <text x="1170" y="1068" font-size="13.5" fill="#94a3b8">or convinced it has found a way out.</text>
</svg>
