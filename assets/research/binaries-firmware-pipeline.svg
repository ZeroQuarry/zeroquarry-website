<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">What a firmware scan actually does</text>
  <text x="28" y="62" font-size="14" fill="#475569">The workload ZeroQuarry's agents run on every image, ending at the PoC grounding gate.</text>

  <!-- row 1 -->
  <circle cx="46" cy="110" r="11" fill="#0f172a"/>
  <text x="46" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="28" y="92" width="200" height="120" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="128" y="122" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Firmware image</text>
  <text x="128" y="148" font-size="11.5" fill="#475569" text-anchor="middle">what ships: kernel,</text>
  <text x="128" y="166" font-size="11.5" fill="#475569" text-anchor="middle">rootfs, vendor blobs --</text>
  <text x="128" y="184" font-size="11.5" fill="#475569" text-anchor="middle">no source, no manifest</text>

  <line x1="228" y1="152" x2="252" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="274" cy="110" r="11" fill="#0f172a"/>
  <text x="274" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="256" y="92" width="200" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="356" y="122" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Unpack</text>
  <text x="356" y="148" font-size="11.5" fill="#475569" text-anchor="middle">binwalk over the image;</text>
  <text x="356" y="166" font-size="11.5" fill="#475569" text-anchor="middle">a rootfs holds tens of</text>
  <text x="356" y="184" font-size="11.5" fill="#475569" text-anchor="middle">thousands of files</text>

  <line x1="456" y1="152" x2="480" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="502" cy="110" r="11" fill="#0f172a"/>
  <text x="502" y="114" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="484" y="92" width="200" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="584" y="122" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Inventory</text>
  <text x="584" y="148" font-size="11.5" fill="#475569" text-anchor="middle">binaries, configs, certs,</text>
  <text x="584" y="166" font-size="11.5" fill="#475569" text-anchor="middle">keys; the SCA pre-pass</text>
  <text x="584" y="184" font-size="11.5" fill="#475569" text-anchor="middle">rides along</text>

  <!-- wrap arrow: inventory down and back to decompile -->
  <path d="M 684 152 L 712 152 L 712 268 L 128 268 L 128 292" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <circle cx="46" cy="314" r="11" fill="#0f172a"/>
  <text x="46" y="318" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="28" y="296" width="200" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="128" y="326" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Decompile</text>
  <text x="128" y="352" font-size="11.5" fill="#475569" text-anchor="middle">jadx for DEX/JAR;</text>
  <text x="128" y="370" font-size="11.5" fill="#475569" text-anchor="middle">Ghidra for native</text>
  <text x="128" y="388" font-size="11.5" fill="#475569" text-anchor="middle">binaries</text>

  <line x1="228" y1="356" x2="252" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="274" cy="314" r="11" fill="#0f172a"/>
  <text x="274" y="318" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="256" y="296" width="200" height="120" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2" filter="url(#ds)"/>
  <text x="356" y="326" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Investigate</text>
  <text x="356" y="352" font-size="11.5" fill="#475569" text-anchor="middle">a coordinator agent</text>
  <text x="356" y="370" font-size="11.5" fill="#475569" text-anchor="middle">schedules workers over</text>
  <text x="356" y="388" font-size="11.5" fill="#475569" text-anchor="middle">parsers, auth, update flows</text>

  <line x1="456" y1="356" x2="480" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="502" cy="314" r="11" fill="#0f172a"/>
  <text x="502" y="318" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <rect x="484" y="296" width="200" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="584" y="326" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">PoC gate</text>
  <text x="584" y="352" font-size="11.5" fill="#14532d" text-anchor="middle">grounding + self-checks,</text>
  <text x="584" y="370" font-size="11.5" fill="#14532d" text-anchor="middle">before anything</text>
  <text x="584" y="388" font-size="11.5" fill="#14532d" text-anchor="middle">reaches the report</text>

</svg>
