<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="760" height="620" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" font-weight="700" fill="#0f172a">The AI surface is three things the code does</text>
  <text x="28" y="62" font-size="14" fill="#475569">None of it is a package, so none of it reaches a scanner's inventory. None of it is source the rules parse.</text>

  <!-- Band 1: calls -->
  <rect x="28" y="86" width="704" height="140" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="48" y="118" font-size="15.5" font-weight="700" fill="#166534">Calls: model and provider identifiers</text>
  <text x="48" y="140" font-size="13" fill="#14532d" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">model = "qwen2.5-72b-instruct"   # pinned in code</text>
  <text x="48" y="162" font-size="13" fill="#14532d">LLM provider SDKs · referenced model identifiers · model endpoints</text>
  <rect x="512" y="176" width="200" height="40" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="612" y="192" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">why it matters</text>
  <text x="612" y="207" font-size="10" fill="#14532d" text-anchor="middle">a dependency with a license</text>

  <!-- Band 2: embeds -->
  <rect x="28" y="242" width="704" height="140" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="48" y="274" font-size="15.5" font-weight="700" fill="#5b21b6">Embeds: instructions living in the repo</text>
  <text x="48" y="296" font-size="13" fill="#4c1d95" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">SYSTEM_PROMPT = "You may run any shell command..."</text>
  <text x="48" y="318" font-size="13" fill="#4c1d95">System prompts as string constants · skill files · AGENTS.md</text>
  <rect x="512" y="332" width="200" height="40" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="612" y="348" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">why it matters</text>
  <text x="612" y="363" font-size="10" fill="#4c1d95" text-anchor="middle">executes on the model's next step</text>

  <!-- Band 3: delegates -->
  <rect x="28" y="398" width="704" height="140" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2.5" filter="url(#ds)"/>
  <text x="48" y="430" font-size="15.5" font-weight="700" fill="#334155">Delegates: what an agent may touch</text>
  <text x="48" y="452" font-size="13" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">.mcp.json: { "args": ["db-explorer", "--rw"] }</text>
  <text x="48" y="474" font-size="13" fill="#334155">MCP configs · tool registrations and permission scope · auto-approve flags</text>
  <rect x="512" y="488" width="200" height="40" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="612" y="504" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">why it matters</text>
  <text x="612" y="519" font-size="10" fill="#334155" text-anchor="middle">authz outside your identity system</text>

  <text x="380" y="576" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">A tool registration is an authorization decision. A system prompt is executable.</text>
  <text x="380" y="596" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">A model pin is a dependency. Scanners inventory none of the three.</text>
</svg>
