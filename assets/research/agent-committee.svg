<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="28" y="40" font-size="19" fill="#0f172a" font-weight="700">Design by committee</text>
  <text x="28" y="62" font-size="14" fill="#475569">Three models plan on their own, then they score each other's plans.</text>

  <rect x="28" y="96" width="210" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="133" y="124" font-size="13" fill="#334155" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">model 1</text>
  <text x="133" y="144" font-size="11" fill="#475569" text-anchor="middle">proposes a plan</text>
  <rect x="275" y="96" width="210" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="380" y="124" font-size="13" fill="#334155" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">model 2</text>
  <text x="380" y="144" font-size="11" fill="#475569" text-anchor="middle">proposes a plan</text>
  <rect x="522" y="96" width="210" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="627" y="124" font-size="13" fill="#334155" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">model 3</text>
  <text x="627" y="144" font-size="11" fill="#475569" text-anchor="middle">proposes a plan</text>
  <path d="M 133 162 L 133 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 162 L 380 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 627 162 L 627 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="262" y="170" width="236" height="22" fill="#ffffff"/>
  <text x="380" y="186" font-size="11" fill="#64748b" text-anchor="middle">different vendors, different model families</text>
  <rect x="28" y="202" width="704" height="64" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#ds)"/>
  <text x="380" y="228" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">every model rates all 3 plans, including the one it wrote</text>
  <text x="380" y="250" font-size="11" fill="#5b21b6" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">score each one from 1 to 10, with reasons</text>
  <path d="M 198 266 L 198 298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 562 266 L 562 298" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="300" width="340" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="198" y="326" font-size="12.5" fill="#334155" font-weight="700" text-anchor="middle">3. re-incorporate and re-plan</text>
  <text x="198" y="348" font-size="10.5" fill="#64748b" text-anchor="middle">everyone's notes folded back in</text>
  <rect x="392" y="300" width="340" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#ds)"/>
  <text x="562" y="326" font-size="12.5" fill="#334155" font-weight="700" text-anchor="middle">4. re-review one more time</text>
  <text x="562" y="348" font-size="10.5" fill="#64748b" text-anchor="middle">then the bundle goes to a human</text>
  <rect x="28" y="386" width="704" height="42" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#ds)"/>
  <text x="380" y="412" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">3 plans, 3 sets of scores, and the reasons behind the scores</text>
</svg>
